<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<title>化学基礎クエスト 〜暗記事項マスター〜</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('swTheme')||'default');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#1e293b;
  --bg:#fdf6ff;
  --accent:#fb7185;
  --accent-deep:#e11d48;
  --blue:#8b5cf6;
  --green:#16a34a;
  --red:#dc2626;
  --gray:#94a3b8;
  --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:Century,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;
}
header{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  flex:none;display:flex;align-items:center;gap:10px;
}
header .title{font-weight:700;font-size:15px;letter-spacing:.02em;flex:1}
header .sub{font-size:10px;opacity:.75}
.questSelect{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-weight:700;font-size:13px;padding:4px 6px;font-family:inherit}
.accountBtnWrap{margin-left:auto}
.questSelect option{color:var(--ink)}
.backrow{margin-bottom:10px}
.backbtn{border:none;background:none;color:var(--blue);font-size:13px;font-weight:700;padding:4px 0}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto}
.view.active{display:block}
.panel{height:100%;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.panel h2{font-size:17px;margin:6px 0 12px}
.card-ui{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}
.bigbtn{display:block;width:100%;padding:14px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:700;margin-top:10px}
.bigbtn.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.bigbtn.amber{background:var(--accent-deep)}
.bigbtn:disabled{background:#cbd5e1;color:#f1f5f9;border:none}
.muted{color:#64748b;font-size:12px;line-height:1.6}
nav{flex:none;display:flex;background:#fff;border-top:1px solid #e2e8f0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 6px;border:none;background:none;font-size:11px;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .ico{font-size:20px;line-height:1}
nav button.active{color:var(--blue);font-weight:700}
.badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}
/* 単元一覧(デッキ選択) */
.decklist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.deckbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink)}
.deckbtn:active{border-color:var(--accent)}
.deckbtn.perfect{background:#f0fdf4;border-color:#86efac}
.deckbtn-score{flex:none;text-align:right;font-size:19px;font-weight:800;color:var(--blue);white-space:nowrap}
.deckbtn.perfect .deckbtn-score{color:var(--green)}
.deckbtn-pct{display:block;font-size:11.5px;font-weight:600;color:#64748b}
/* 正誤ポップアップ・自動送り */
.viewfx-toggles{position:absolute;right:10px;top:8px;z-index:5;display:flex;gap:6px}
.viewfx-toggle{background:rgba(255,255,255,.92);border:1.5px solid #e2e8f0;border-radius:8px;font-size:10.5px;font-weight:700;color:#64748b;padding:6px 9px;box-shadow:0 1px 3px rgba(0,0,0,.06);white-space:nowrap}
.viewfx-toggle.on{background:#eff6ff;border-color:var(--blue);color:var(--blue)}
#answerFxPopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:70;pointer-events:none}
#answerFxPopup.show{display:flex}
.afx-box{text-align:center;animation:afxpop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes afxpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.afx-symbol{font-size:130px;font-weight:900;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.afx-symbol.ok{color:var(--green)}
.afx-symbol.ng{color:var(--red)}
.afx-sub{font-size:26px;margin-top:2px}
.afx-confetti{font-size:30px;margin-top:4px;letter-spacing:6px}
.fixed-next{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:592px;margin:0 auto;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.fixed-back{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;padding:8px 14px;border-radius:99px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* 復習からもう一度 */
.review-item.review-tap{cursor:pointer;display:flex;align-items:center;gap:6px}
.review-item.review-tap:active{background:#f8fafc}
.review-item.review-tap::after{content:'↻ もう一度';margin-left:auto;flex:none;font-size:11px;color:var(--blue);font-weight:700;white-space:nowrap}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:80}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:20px;max-height:86vh}
}
.sheet h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.closex{margin-left:auto;border:none;background:#f1f5f9;border-radius:99px;width:30px;height:30px;font-size:14px;color:#64748b;flex:none}
/* quiz */
.qprompt{font-size:15px;font-weight:700;margin-bottom:14px;line-height:1.6;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{border:2px solid #e2e8f0;border-radius:14px;background:#fff;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5;text-align:left}
.choice:active{background:#f8fafc}
.choice.correct{border-color:var(--green);background:#f0fdf4}
.choice.wrong{border-color:var(--red);background:#fef2f2;animation:shake .3s}
.choice.dim{opacity:.45}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.explain{margin-top:12px;border-radius:14px;padding:12px;font-size:13px;line-height:1.7;display:none}
.explain.ok{display:block;background:#f0fdf4;border:1.5px solid #86efac}
.explain.ng{display:block;background:#fef2f2;border:1.5px solid #fca5a5}
.explain .rname{font-weight:800;font-size:13.5px;margin-bottom:3px}
.explain .note{margin-top:4px}
/* challenge/drill common */
.chal-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:10px;color:#475569}
.chal-timer{text-align:center;font-size:22px;font-weight:800;color:var(--blue);margin-bottom:8px}
.chal-timer.urgent{color:var(--red)}
.rankbig{font-size:64px;font-weight:900;text-align:center;line-height:1.1}
.rank-S{color:#d97706}.rank-A{color:#dc2626}.rank-B{color:#2563eb}.rank-C{color:#16a34a}.rank-D{color:#64748b}
.score-line{text-align:center;font-size:15px;font-weight:700;margin:6px 0 2px}
.review-item{border-bottom:1px solid #f1f5f9;padding:9px 2px;font-size:12.5px;line-height:1.6}
.review-item .ok{color:var(--green);font-weight:700}
.review-item .ng{color:var(--red);font-weight:700}
.scopebtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scopebtns button{flex:1;min-width:100px;padding:10px 4px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:12.5px;font-weight:700;color:#475569}
.scopebtns button.sel{border-color:var(--blue);color:var(--blue);background:#eff6ff}
.decklist-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sortmini{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b}
.sortmini.sel{border-color:var(--blue);color:var(--blue);background:#eff6ff}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,41,59,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap;max-width:92vw}
#toast.show{opacity:1}
/* ================= 元素グリッド ================= */
#view-grid{--eg-metal:#8b5cf6;--eg-nonmetal:#16a34a}
.eg-levelgrid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.eg-levelbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid #e2e8f0;background:#fff}
.eg-levelbtn:active{border-color:var(--blue)}
.eg-lv-name{font-size:16px;font-weight:800;color:var(--ink)}
.eg-lv-sub{display:block;font-size:11.5px;color:#64748b;margin-top:2px}
.eg-lv-best{text-align:right;font-size:11px;color:#64748b;flex:none}
.eg-lv-best b{display:block;font-size:16px;color:var(--blue);font-family:'JetBrains Mono',monospace}
.eg-legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:#64748b}
.eg-legend span{display:inline-flex;align-items:center;gap:5px}
.eg-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.eg-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.eg-timer{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--ink)}
.eg-miss{font-size:12px;color:var(--red);font-weight:700}
.eg-target{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.eg-target-label{font-size:10.5px;color:#94a3b8}
.eg-target-symbol{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:30px;line-height:1;color:var(--blue);min-width:1.6ch}
.eg-target-name{font-size:12px;color:#64748b}
.eg-target-z{margin-left:auto;font-size:10.5px;color:#94a3b8;text-align:right}
.eg-target-z b{display:block;font-size:18px;color:var(--ink);font-family:'JetBrains Mono',monospace}
.eg-fieldwrap{position:relative;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:10px}
.eg-field{display:grid;gap:8px}
.eg-tile{aspect-ratio:1;border-radius:12px;border:2px solid var(--tile-color,var(--blue));background:#fff;color:var(--ink);font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,opacity .3s ease,box-shadow .15s ease;touch-action:manipulation}
.eg-field.eg-pre-start .eg-tile{opacity:0}
.eg-tile:active{transform:scale(.9)}
.eg-tile.eg-correct{animation:eg-pop .4s ease forwards;pointer-events:none}
.eg-tile.eg-wrong{animation:eg-shake .32s ease;border-color:var(--red)}
@keyframes eg-pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(.3);opacity:0}}
@keyframes eg-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eg-countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.85);border-radius:16px;z-index:5}
.eg-countdown.active{display:flex}
.eg-countdown-num{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:70px;color:var(--blue);animation:eg-countpop .5s ease-out}
@keyframes eg-countpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
/* ================= ダークモード(元素グリッドの配色ベース) ================= */
.themeBtn{flex:none;margin-left:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;display:flex;align-items:center;justify-content:center}
html[data-theme="navy"]{
  --ink:#eef3f1;
  --bg:#12181a;
  --card:#1a2224;
  --blue:#4fd8c4;
}
html[data-theme="navy"] body{background:var(--bg);color:var(--ink)}
html[data-theme="navy"] header{background:linear-gradient(135deg,#0b0f10,#1a2224);border-bottom:1px solid rgba(79,216,196,.25)}
html[data-theme="navy"] .questSelect{background:rgba(255,255,255,.08);border-color:rgba(79,216,196,.3)}
html[data-theme="navy"] .muted{color:#93a4a2}
html[data-theme="navy"] .card-ui{background:rgba(255,255,255,.05);border:1px solid rgba(79,216,196,.2);box-shadow:0 0 20px rgba(79,216,196,.08)}
html[data-theme="navy"] .bigbtn{background:var(--blue);color:#08201c;box-shadow:0 0 20px rgba(79,216,196,.35)}
html[data-theme="navy"] .bigbtn.secondary{background:rgba(255,255,255,.05);color:var(--blue);border-color:var(--blue)}
html[data-theme="navy"] .bigbtn.amber{background:linear-gradient(135deg,#ffb145,#ff6f5f);color:#221206}
html[data-theme="navy"] .bigbtn:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3)}
html[data-theme="navy"] nav{background:rgba(10,15,16,.94);border-top:1px solid rgba(79,216,196,.2);backdrop-filter:blur(14px)}
html[data-theme="navy"] nav button{color:#93a4a2}
html[data-theme="navy"] .deckbtn{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:var(--ink)}
html[data-theme="navy"] .deckbtn.perfect{background:rgba(62,232,165,.12);border-color:var(--green)}
html[data-theme="navy"] .viewfx-toggle{background:rgba(19,32,34,.85);border-color:rgba(79,216,196,.25);color:#93a4a2}
html[data-theme="navy"] .viewfx-toggle.on{background:rgba(79,216,196,.15);border-color:var(--blue);color:var(--blue)}
html[data-theme="navy"] .fixed-back{background:rgba(19,32,34,.92);border-color:var(--blue);color:var(--blue)}
html[data-theme="navy"] .review-item{border-bottom-color:rgba(255,255,255,.1)}
html[data-theme="navy"] .review-item.review-tap:active{background:rgba(255,255,255,.05)}
html[data-theme="navy"] .modal{background:rgba(2,6,14,.65)}
html[data-theme="navy"] .sheet{background:rgba(16,26,28,.96);border:1px solid rgba(79,216,196,.2);color:var(--ink)}
html[data-theme="navy"] .closex{background:rgba(255,255,255,.1);color:var(--ink)}
html[data-theme="navy"] .qprompt{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
html[data-theme="navy"] .choice{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16);color:var(--ink)}
html[data-theme="navy"] .choice.correct{background:rgba(62,232,165,.15);border-color:var(--green)}
html[data-theme="navy"] .choice.wrong{background:rgba(255,111,111,.15);border-color:var(--red)}
html[data-theme="navy"] .explain.ok{background:rgba(62,232,165,.1);border-color:rgba(62,232,165,.4)}
html[data-theme="navy"] .explain.ng{background:rgba(255,111,111,.1);border-color:rgba(255,111,111,.4)}
html[data-theme="navy"] .chal-head{color:#93a4a2}
html[data-theme="navy"] .scopebtns button,html[data-theme="navy"] .sortmini{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:var(--ink)}
html[data-theme="navy"] .scopebtns button.sel,html[data-theme="navy"] .sortmini.sel{background:rgba(79,216,196,.15);border-color:var(--blue);color:var(--blue)}
html[data-theme="navy"] #toast{background:rgba(19,32,34,.95);border:1px solid rgba(79,216,196,.3)}
html[data-theme="navy"] .eg-levelbtn{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16)}
html[data-theme="navy"] .eg-levelbtn:active{border-color:var(--blue)}
html[data-theme="navy"] .eg-target{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
html[data-theme="navy"] .eg-fieldwrap{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.14)}
html[data-theme="navy"] .eg-tile{background:rgba(255,255,255,.05);color:var(--ink)}
html[data-theme="navy"] .eg-countdown{background:rgba(10,15,16,.85)}

/* ---- 化学ランナー ---- */
#runnerPanel{--rn-true:#06d6a0;--rn-false:#ef476f;--rn-accent:#ffd166}
.rn-track{position:relative;height:150px;background:linear-gradient(#bde0fe,#eaf6ff 55%,#a2d2ff);overflow:hidden;border-radius:16px;margin-bottom:12px}
.rn-hill{position:absolute;bottom:20px;border-radius:50% 50% 0 0;opacity:.5}
.rn-hill1{width:220px;height:70px;left:-30px;background:#8fc2a0;animation:rnHillScroll 9s linear infinite}
.rn-hill2{width:180px;height:46px;left:280px;background:#a8d4b3;animation:rnHillScroll 13s linear infinite}
@keyframes rnHillScroll{from{transform:translateX(0)}to{transform:translateX(-900px)}}
.rn-ground-wrap{position:absolute;bottom:0;left:0;width:200%;height:18px;display:flex;animation:rnGroundMove var(--rn-grounddur,.55s) linear infinite}
.rn-ground-strip{width:50%;height:100%;background:repeating-linear-gradient(90deg,#8a5a3b 0 28px,#6b4326 28px 34px)}
@keyframes rnGroundMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rn-wall{position:absolute;bottom:4px;left:250px;width:26px;height:74px;background:repeating-linear-gradient(0deg,#b5533c 0 14px,#93402d 14px 16px),repeating-linear-gradient(90deg,transparent 0 24px,#93402d 24px 26px);border-radius:3px 3px 0 0;box-shadow:0 4px 6px rgba(0,0,0,.35);transition:left .35s cubic-bezier(.4,0,.2,1)}
.rn-runner{position:absolute;bottom:4px;left:26px;width:36px;height:58px;animation:rnBob var(--rn-legdur,.38s) infinite ease-in-out}
.rn-runner.hit{animation:rnHitshake .4s}
.rn-runner.boost{animation:rnDash .3s ease-out}
.rn-runner.crash{animation:rnCrash .6s forwards}
.rn-head{position:absolute;top:0;left:13px;width:13px;height:13px;border-radius:50%;background:#2b2b2b}
.rn-torso{position:absolute;top:12px;left:16px;width:6px;height:20px;background:#2b2b2b;border-radius:3px}
.rn-arm{position:absolute;top:14px;width:4px;height:15px;background:#2b2b2b;border-radius:2px;transform-origin:top center}
.rn-arm-back{left:11px;animation:rnArmBack var(--rn-legdur,.38s) infinite linear}
.rn-arm-front{left:22px;animation:rnArmFront var(--rn-legdur,.38s) infinite linear}
.rn-leg{position:absolute;top:30px;width:5px;height:18px;background:#2b2b2b;border-radius:2px;transform-origin:top center}
.rn-leg-back{left:14px;animation:rnLegBack var(--rn-legdur,.38s) infinite linear}
.rn-leg-front{left:19px;animation:rnLegFront var(--rn-legdur,.38s) infinite linear}
@keyframes rnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rnLegBack{0%{transform:rotate(35deg)}50%{transform:rotate(-35deg)}100%{transform:rotate(35deg)}}
@keyframes rnLegFront{0%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}100%{transform:rotate(-35deg)}}
@keyframes rnArmBack{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@keyframes rnArmFront{0%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}100%{transform:rotate(30deg)}}
@keyframes rnHitshake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
@keyframes rnDash{0%{transform:translateX(0)}40%{transform:translateX(10px)}100%{transform:translateX(0)}}
@keyframes rnCrash{0%{transform:rotate(0) translateY(0)}100%{transform:rotate(75deg) translateY(6px)}}
.rn-cloud{position:absolute;font-size:1.4rem;opacity:.8;animation:rnDrift linear infinite}
@keyframes rnDrift{from{transform:translateX(0)}to{transform:translateX(-700px)}}
.rn-hud{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#64748b;margin-bottom:8px}
.rn-genretag{display:inline-block;background:#eef2ff;color:#2667cc;padding:2px 9px;border-radius:20px;font-size:11px;margin-bottom:8px}
.rn-timer-row{float:right;font-size:12px;font-weight:700;color:#334155}
.rn-timer-bar{clear:both;height:7px;background:#e5e5ea;border-radius:6px;overflow:hidden;margin-bottom:10px}
.rn-timer-fill{height:100%;width:100%;background:var(--rn-true);transition:width .12s linear,background .3s}
.rn-statement{font-size:15px;line-height:1.65;color:var(--ink);min-height:70px}
.rn-feedback{min-height:40px;margin-top:8px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.55;display:none}
.rn-feedback.correct{background:#e5fff5;color:#046b4c;display:block}
.rn-feedback.wrong{background:#ffe9ee;color:#9c1338;display:block}
.rn-answer-row{display:flex;gap:10px;margin-top:12px}
.rn-ans-btn{flex:1;padding:16px 0;font-size:1.3rem;font-weight:800;border-radius:14px;border:none;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.rn-ans-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.rn-ans-btn.true-btn{background:var(--rn-true)}
.rn-ans-btn.false-btn{background:var(--rn-false)}
.rn-ans-btn:disabled{opacity:.5}
.rn-ans-btn small{display:block;font-size:.65rem;font-weight:400;margin-top:2px}
.rn-review-item{padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;font-size:12.5px}
.rn-review-item.is-wrong{border-color:#f7c3ce;background:#fff8f9}
.rn-review-item .rv-head{display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:11px;margin-bottom:4px}
.rn-review-item .rv-mark{font-weight:700;font-size:13px}
.rn-review-item .rv-mark.correct{color:#06a06a}
.rn-review-item .rv-mark.wrong{color:#ef476f}
.rn-review-item .rv-statement{color:var(--ink);line-height:1.5}
.rn-review-item .rv-explanation{color:#64748b;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0;line-height:1.5}
html[data-theme="navy"] .rn-statement{color:var(--ink)}
html[data-theme="navy"] .rn-review-item{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16)}
html[data-theme="navy"] .rn-review-item.is-wrong{background:rgba(255,111,111,.1);border-color:rgba(255,111,111,.4)}

'use strict';
let memoLikes={}, memoLikesLoaded=false;
LB.init('chembasics');
document.getElementById('accountBtn').onclick=()=>LB.openAccountModal();
document.getElementById('themeBtn').onclick=()=>{
  const next = document.documentElement.getAttribute('data-theme')==='navy' ? 'default' : 'navy';
  localStorage.setItem('swTheme', next);
  document.documentElement.setAttribute('data-theme', next);
};
LB.onAuth(u=>{
  const btn = document.getElementById('accountBtn');
  if(!btn) return;
  if(u && u.avatar) btn.innerHTML = `<img src="${u.avatar}">`;
  else if(u) btn.textContent = (u.nickname||'?')[0];
  else btn.textContent = '👤';
  memoLikesLoaded=false; memoLikes={};
  const hp = document.getElementById('homePanel');
  if(hp && hp.querySelector('.decklist')) renderHome();
});
LB.onMessages(count=>{
  const b = document.getElementById('notifBadge');
  if(!b) return;
  b.textContent = count>9?'9+':count;
  b.style.display = count>0?'':'none';
});
LB.onAuth(()=>{
  if(document.getElementById('chalStart')&&typeof renderChallengeHome==='function') renderChallengeHome();
  else if(document.getElementById('lbBox')&&typeof chalKind!=='undefined'&&typeof refreshLbBox==='function') refreshLbBox(chalKind);
});

const CATEGORIES = DATA.categories;
const ITEMS = DATA.items;
const IMAP = Object.fromEntries(ITEMS.map(it=>[it.id,it]));

/* ================= 状態 ================= */
let state={mastered:[],weak:{},best:null,catStats:{},inProgress:{},answerFx:'popup',answerAuto:false};
function save(){try{localStorage.setItem('inorganicQuest1',JSON.stringify(state));}catch(e){}LB.pushState('inorganicQuest1',state);}
function load(){try{const s=localStorage.getItem('inorganicQuest1');if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}}
LB.attachStateSync('inorganicQuest1',()=>localStorage.getItem('inorganicQuest1'));
LB.maybeShowOnboarding('inorganicQuest1');
function isMastered(id){return state.mastered.includes(id);}
function markMastered(id){if(!isMastered(id)){state.mastered.push(id);save();}}
function weakCount(){return Object.keys(state.weak).length;}
function updateWeakBadge(){
  const b=document.getElementById('weakBadge');
  const n=weakCount();
  b.style.display=n?'block':'none'; b.textContent=n;
}

/* ================= 共通ユーティリティ ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a.slice()).slice(0,n);}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function buildChoices(it){
  const choices=[{text:it.correct,ok:true},...it.wrongs.map(w=>({text:w,ok:false}))];
  return shuffle(choices);
}
function renderQuiz(el,it,onDone,progressText){
  const choices=buildChoices(it);
  let ch='<div class="choices">';
  choices.forEach((c,i)=>{ch+=`<button class="choice" data-i="${i}">${c.text}</button>`;});
  ch+='</div>';
  el.innerHTML=`
    ${progressText?`<div class="chal-head">${progressText}</div>`:''}
    <div class="qprompt">${it.q}</div>
    ${ch}
    <div class="explain" id="explainBox"></div>
    <button class="bigbtn" id="nextBtn" style="display:none">つぎへ</button>`;
  let answered=false;
  el.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return; answered=true;
      const c=choices[+btn.dataset.i];
      el.querySelectorAll('.choice').forEach((b,j)=>{
        const cc=choices[j];
        if(cc.ok)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
      const ex=el.querySelector('#explainBox');
      ex.className='explain '+(c.ok?'ok':'ng');
      ex.innerHTML=`<div class="rname">${c.ok?'⭕ 正解!':'❌ 不正解… 正解は「'+it.correct+'」'}</div>${it.exp?`<div class="note">${it.exp}</div>`:''}`;
      const nb=el.querySelector('#nextBtn');
      nb.style.display='block';
      nb.onclick=()=>onDone(c.ok);
      nb.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });
}

const ANSWER_FX_DURATION=900;
function showAnswerFxPopup(ok){
  const el=document.getElementById('answerFxPopup');
  el.innerHTML=ok?
    `<div class="afx-box"><div class="afx-symbol ok">○</div><div class="afx-confetti">🎉🎊✨</div></div>`:
    `<div class="afx-box"><div class="afx-symbol ng">×</div><div class="afx-sub">( ；∀；)</div></div>`;
  el.classList.add('show');
  clearTimeout(showAnswerFxPopup._t);
  showAnswerFxPopup._t=setTimeout(()=>el.classList.remove('show'),ANSWER_FX_DURATION);
}
function renderMemoQ(el,it,onDone,progressText){
  const choices=buildChoices(it);
  let ch='<div class="choices">';
  choices.forEach((c,i)=>{ch+=`<button class="choice" data-i="${i}">${c.text}</button>`;});
  ch+='</div>';
  el.innerHTML=`
    ${progressText?`<div class="chal-head">${progressText}</div>`:''}
    <div class="qprompt">${it.q}</div>
    ${ch}
    <div style="height:80px"></div>
    <button class="bigbtn fixed-next" id="memoNextBtn" style="display:none">次へ</button>`;
  let answered=false;
  el.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return; answered=true;
      const c=choices[+btn.dataset.i];
      btn.classList.add(c.ok?'correct':'wrong');
      if(state.answerFx!=='simple')showAnswerFxPopup(c.ok);
      const nb=el.querySelector('#memoNextBtn');
      nb.style.display='block';
      let advanced=false;
      const advance=()=>{if(advanced)return;advanced=true;onDone(c.ok);};
      nb.onclick=advance;
      if(state.answerAuto)memoAdvanceTimer=setTimeout(advance,ANSWER_FX_DURATION+(c.ok?0:1000));
    });
  });
}
function reviewRetry(it){
  const choices=buildChoices(it);
  let ch='<div class="choices">';
  choices.forEach((c,i)=>{ch+=`<button class="choice" data-i="${i}">${c.text}</button>`;});

      const c=choices[+btn.dataset.i];
      infoSheet.querySelectorAll('.choice').forEach((b,j)=>{
        const cc=choices[j];
        if(cc.ok)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
    });
  });
}

let catDrill=null;
let memoAdvanceTimer=null;
function memoClearAdvanceTimer(){ if(memoAdvanceTimer){clearTimeout(memoAdvanceTimer);memoAdvanceTimer=null;} }
function catStats(cat){
  return state.catStats[cat]||null;
}
let catSort={field:'no',dir:'asc'};
function sortedCategories(){
  const arr=CATEGORIES.map((c,i)=>({c,i}));
  arr.sort((a,b)=>{
    let av,bv;
    if(catSort.field==='pct'){
      const sa=catStats(a.c.name), sb=catStats(b.c.name);
      av=sa?(sa.best||0):0; bv=sb?(sb.best||0):0;
    }else{ av=a.i; bv=b.i; }
    return catSort.dir==='asc'?av-bv:bv-av;
  });
  return arr.map(x=>x.c);
}
function renderHome(){
  memoClearAdvanceTimer();
  if(!memoLikesLoaded && LB.currentUser()){
    memoLikesLoaded=true;
    LB.fetchLikes('inorganic').then(likes=>{ memoLikes=likes||{}; if(!catDrill) renderHome(); });
  }
  let list='';
  for(const c of sortedCategories()){
    const s=catStats(c.name);
    const lastPct=s?Math.round(100*s.correct/s.total):0;
    const bestPct=s?(s.best||lastPct):0;
    const ip=state.inProgress[c.name];
    list+=`<button class="deckbtn${bestPct===100?' perfect':''}" data-cat="${c.name}">
      <span>${c.name}<span class="muted" style="display:block;font-weight:400;margin-top:2px">${ip?`⏸ 途中(${ip.i}/${ip.ids.length})・`:''}${c.count}問</span></span>
      <span class="deckbtn-score">今回 ${lastPct}%<span class="deckbtn-pct">最高 ${bestPct}%${memoLikes[c.name]?' 👍':''}</span></span>
      </button>`;
  }
  const arrow=catSort.dir==='asc'?'▲':'▼';
  homePanel.innerHTML=`
    <h2>🧠 暗記モード</h2>
    <div class="card-ui">
      <div style="font-size:13.5px;line-height:1.8">単元を選ぶとランダムに一問一答。<b>間違えた問題は弱点特訓に自動追加</b>されます。</div>
    </div>
    <div class="card-ui">
      <div class="decklist-head">
        <b>単元を選ぶ</b>
        <div style="display:flex;gap:4px">
          <button id="sortNo" class="sortmini ${catSort.field==='no'?'sel':''}">No順${catSort.field==='no'?' '+arrow:''}</button>
          <button id="sortPct" class="sortmini ${catSort.field==='pct'?'sel':''}">正答率順${catSort.field==='pct'?' '+arrow:''}</button>
        </div>
      </div>
      <div class="decklist">${list}</div>
    </div>`;
  document.getElementById('sortNo').onclick=()=>{
    if(catSort.field==='no')catSort.dir=catSort.dir==='asc'?'desc':'asc';
    else{catSort.field='no';catSort.dir='asc';}
    renderHome();
  };
  document.getElementById('sortPct').onclick=()=>{
    if(catSort.field==='pct')catSort.dir=catSort.dir==='asc'?'desc':'asc';
    else{catSort.field='pct';catSort.dir='desc';}
    renderHome();
  };
  homePanel.querySelectorAll('.deckbtn').forEach(el=>{
    el.addEventListener('click',()=>startCatDrill(el.dataset.cat));
  });
}
function startCatDrill(cat,mode){
  memoClearAdvanceTimer();
  const ip=state.inProgress[cat];
  if(ip&&!mode){
    homePanel.innerHTML=`<div class="card-ui" style="text-align:center">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">「${cat}」は ${ip.i} / ${ip.ids.length} 問まで進んでいます</div>
      <button class="bigbtn" id="resumeBtn">続きから</button>
      <button class="bigbtn secondary" id="restartBtn">最初から</button>
      <button class="backbtn" id="chooseBack" style="margin-top:8px">← 単元一覧に戻る</button>
    </div>`;
    document.getElementById('resumeBtn').onclick=()=>startCatDrill(cat,'resume');
    document.getElementById('restartBtn').onclick=()=>startCatDrill(cat,'restart');
    document.getElementById('chooseBack').onclick=()=>renderHome();
    return;
  }
  if(mode==='resume'){
    catDrill={cat,its:ip.ids.map(id=>IMAP[id]),i:ip.i,results:ip.results||[]};
  }else{
    delete state.inProgress[cat]; save();
    const catItems=ITEMS.filter(it=>it.cat===cat);
    catDrill={cat,its:cat.endsWith('(原子番号順)')?catItems.slice():shuffle(catItems),i:0,results:[]};
  }
  nextCatQ();
}
function catResult(){
  memoClearAdvanceTimer();
  const correct=catDrill.results.filter(x=>x.ok).length;
  const total=catDrill.results.length;
  const pct=Math.round(100*correct/total);
  const prev=state.catStats[catDrill.cat];
  const prevBest=prev?prev.best:0;
  const best=Math.max(prevBest,pct);
  state.catStats[catDrill.cat]={correct,total,best};
  delete state.inProgress[catDrill.cat];
  LB.recordQuizResults('inorganic', catDrill.results.map(x=>({id:x.it.id, ok:x.ok})));
  if(prevBest<100 && best===100) LB.notifyAdmin('perfect', {game:'化学基礎', setName:catDrill.cat});
  save();
  let review='';
  catDrill.results.forEach((x,i)=>{
    review+=`<div class="review-item${x.ok?'':' review-tap'}" ${x.ok?'':`data-i="${i}"`}><span class="${x.ok?'ok':'ng'}">${x.ok?'⭕':'❌'}</span> ${x.it.q} → ${x.it.correct}</div>`;
  });
  homePanel.innerHTML=`
    <h2>結果発表</h2>
    <div class="card-ui" style="text-align:center">
      <div class="score-line" style="font-size:22px">正解 ${correct} / ${total}(${pct}%)</div>
      <div class="muted">${pct>=best?'自己ベスト更新!':`最高記録 ${best}%`}</div>
      <button class="bigbtn" id="catAgain">もう一度</button>
      <button class="bigbtn secondary" id="catHome">単元一覧に戻る</button>
    </div>
    <div class="card-ui"><b>復習リスト</b>${review}</div>`;
  homePanel.querySelectorAll('.review-tap').forEach(el=>{
    el.onclick=()=>reviewRetry(catDrill.results[+el.dataset.i].it);
  });
  document.getElementById('catAgain').onclick=()=>startCatDrill(catDrill.cat);
  document.getElementById('catHome').onclick=()=>{catDrill=null;renderHome();};
  homePanel.scrollTop=0;
}
function nextCatQ(){
  if(catDrill.i>=catDrill.its.length)return catResult();
  const it=catDrill.its[catDrill.i];
  homePanel.innerHTML='<div id="cdq"></div><button class="fixed-back" id="catBack">← 単元選択</button>';
  document.getElementById('catBack').onclick=()=>{
    memoClearAdvanceTimer();
    state.inProgress[catDrill.cat]={ids:catDrill.its.map(x=>x.id),i:catDrill.i,results:catDrill.results};
    save();
    catDrill=null; renderHome();
  };
  renderMemoQ(document.getElementById('cdq'),it,ok=>{
    memoAdvanceTimer=null;
    catDrill.results.push({it,ok});
    if(ok)markMastered(it.id);
    else{state.weak[it.id]=2;save();updateWeakBadge();}
    catDrill.i++; nextCatQ();
  },`${catDrill.cat}　${catDrill.i+1} / ${catDrill.its.length}`);
  homePanel.scrollTop=0;
}

function chalRank(kind,correct){
  if(kind==='time')return correct>=15?'S':correct>=11?'A':correct>=7?'B':correct>=3?'C':'D';

function buildChalQueue(){
  return shuffle(ITEMS.slice());
}
function startChallenge(){
  chal={kind:chalKind,queue:buildChalQueue(),idx:0,correct:0,t0:Date.now(),over:false};
  nextChalQ();
}
function renderChalQuiz(el,it,progressText,timeLimitSec,onDone){
  const choices=buildChoices(it);
  let ch='<div class="choices">';
  choices.forEach((c,i)=>{ch+=`<button class="choice" data-i="${i}">${c.text}</button>`;});
  ch+='</div>';
  el.innerHTML=`
    ${progressText?`<div class="chal-head">${progressText}</div>`:''}
    ${timeLimitSec?`<div class="chal-timer" id="chalTimer">⏱ ${timeLimitSec}秒</div>`:''}
    <div class="qprompt">${it.q}</div>
    ${ch}`;
  let answered=false;
  function finish(ok,timedOut){
    if(answered)return; answered=true;
    stopChalTimer();
    el.querySelectorAll('.choice').forEach(b=>{
      const c=choices[+b.dataset.i];
      if(c.ok)b.classList.add('correct');
      else if(!timedOut&&b.dataset.clicked)b.classList.add('wrong');
    });
    setTimeout(()=>onDone(ok,timedOut),650);
  }
  if(timeLimitSec){
    const t0=Date.now();
    const timerEl=el.querySelector('#chalTimer');
    chalTimerIv=setInterval(()=>{
      const left=timeLimitSec-(Date.now()-t0)/1000;
      if(left<=0){finish(false,true);}
      else{timerEl.textContent=`⏱ ${Math.ceil(left)}秒`;timerEl.classList.toggle('urgent',left<=3);}
    },100);
  }
  el.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return;
      btn.dataset.clicked='1';
      finish(choices[+btn.dataset.i].ok,false);
    });
  });
}
function nextChalQ(){
  if(chal.kind==='time'){
    const left=CHAL_TIME_LIMIT-(Date.now()-chal.t0)/1000;
    if(left<=0)return chalResult(true);
  }
  if(chal.idx>=chal.queue.length)return chalResult(true);
  const it=chal.queue[chal.idx];
  const session=chal;
  const timeLimitSec=chal.kind==='score'?10:Math.max(1,Math.ceil(CHAL_TIME_LIMIT-(Date.now()-chal.t0)/1000));
  const progressText=chal.kind==='score'?`連続正解 ${chal.correct}問`:`正解 ${chal.correct}問`;
  chalPanel.innerHTML='<div id="cq"></div>';
  renderChalQuiz(document.getElementById('cq'),it,progressText,timeLimitSec,(ok,timedOut)=>{
    if(chal!==session||chal.over)return;
    if(chal.kind==='time'&&timedOut){chalResult(true);return;}
    if(ok){
      if(ok)markMastered(it.id);
      chal.correct++; chal.idx++; nextChalQ();
    }else{
      state.weak[it.id]=2; save(); updateWeakBadge();
      chalResult(false);
    }
  });
  chalPanel.scrollTop=0;
}
function chalResult(reachedEnd){
  if(!chal||chal.over)return;
  chal.over=true;
  stopChalTimer();
  const correct=chal.correct;
  const sec=Math.floor((Date.now()-chal.t0)/1000);
  const rank=chalRank(chal.kind,correct);
  if(!state.bestList)state.bestList={score:[],time:[]};
  const list=state.bestList[chal.kind]||[];
  list.push({correct,sec,rank});
  list.sort((a,b)=>(b.correct-a.correct)||(a.sec-b.sec));
  state.bestList[chal.kind]=list.slice(0,3);
  save();
  const lbSubmit=LB.currentUser()?LB.submitScore(chal.kind,correct,sec,rank):Promise.resolve();
  const headline=reachedEnd?(chal.kind==='time'?'⏰ タイムアップ!':'🎉 コンプリート!'):'💥 ゲームオーバー';
  chalPanel.innerHTML=`
    <h2>結果発表</h2>
    <div class="card-ui" style="text-align:center">
      <div class="score-line" style="font-size:17px">${headline}</div>
      <div class="rankbig rank-${rank}">${rank}</div>
      <div class="score-line">正解 ${correct}問　⏱ ${sec}秒</div>
      <div class="muted">${rank==='S'?'完璧!化学基礎マスター!':rank==='A'?'あと一歩で完全制覇!':rank==='B'?'かなり定着してきた!':rank==='C'?'弱点特訓で復習しよう!':'暗記モードで基礎から固めよう!'}</div>
      <button class="bigbtn" id="chalAgain">もう一度</button>
      <button class="bigbtn secondary" id="chalHome">トップへ</button>
    </div>
    <div class="card-ui" id="lbBox"></div>`;
  document.getElementById('chalAgain').onclick=startChallenge;
  document.getElementById('chalHome').onclick=renderChallengeHome;
  refreshLbBox(chal.kind);
  lbSubmit.then(()=>refreshLbBox(chal.kind));
  chalPanel.scrollTop=0;
}

/* ================= 弱点特訓 ================= */
const weakPanel=document.getElementById('weakPanel');
let drill=null;
function renderWeakHome(){
  const n=weakCount();
  let list='';
  for(const id in state.weak){
    const it=IMAP[id];
    if(!it){delete state.weak[id];continue;}
    list+=`<div class="review-item">🎯 ${it.q} <b>${it.correct}</b> <span class="muted">(あと${state.weak[id]}回連続正解でクリア)</span></div>`;
  }
  weakPanel.innerHTML=`
    <h2>🎯 弱点特訓</h2>
    <div class="card-ui">
      <div style="font-size:13.5px;line-height:1.8">間違えた問題がここに溜まります。<b>2回連続で正解</b>するとリストから消えます。</div>
      <button class="bigbtn amber" id="drillStart" ${n?'':'disabled'}>${n?`特訓スタート(${n}件)`:'弱点はありません🎉'}</button>
    </div>
    ${list?`<div class="card-ui"><b>弱点リスト</b>${list}</div>`:''}`;
  const ds=document.getElementById('drillStart');
  if(n)ds.onclick=startDrill;
}
function startDrill(){
  drill={ids:shuffle(Object.keys(state.weak)),i:0};
  nextDrillQ();
}
function nextDrillQ(){
  while(drill.i<drill.ids.length&&!(drill.ids[drill.i] in state.weak))drill.i++;
  if(drill.i>=drill.ids.length){drill=null;renderWeakHome();updateWeakBadge();toast('特訓おつかれさま!');return;}
  const id=drill.ids[drill.i];
  const it=IMAP[id];
  weakPanel.innerHTML='<div id="dq"></div>';
  renderQuiz(document.getElementById('dq'),it,ok=>{
    if(ok){
      state.weak[id]--;
      if(state.weak[id]<=0){delete state.weak[id];markMastered(id);}
    }else state.weak[id]=2;
    save(); updateWeakBadge();
    drill.i++; nextDrillQ();
  },`弱点特訓　残り ${drill.ids.length-drill.i} 件`);
  weakPanel.scrollTop=0;
}

const GRID_LEVELS={
  basic:   {label:'Easy', cols:3, rows:3, list:GRID_ELEMENTS.slice(0,9),  kind:'gridBasic',    bands:[6,9,13,18]},
  mid:     {label:'Normal', cols:4, rows:4, list:GRID_ELEMENTS.slice(0,16), kind:'gridMid',      bands:[12,17,23,30]},
  advanced:{label:'Hard', cols:5, rows:5, list:GRID_ELEMENTS.slice(0,25), kind:'gridAdvanced', bands:[20,28,38,50]}

function gridBestList(lv){
  if(!state.gridBestList)state.gridBestList={};
  return state.gridBestList[lv]||[];
}
function getGridBest(lv){
  const list=gridBestList(lv);
  return list.length?list[0].sec:null;
}
function addGridResult(lv,sec,rank){
  if(!state.gridBestList)state.gridBestList={};
  const list=gridBestList(lv).slice();
  list.push({sec,rank});
  list.sort((a,b)=>a.sec-b.sec);
  state.gridBestList[lv]=list.slice(0,3);
  save();
}
function fmtGridTime(sec){
  sec=Math.max(0,sec||0);
  const m=Math.floor(sec/60), s=sec-m*60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s.toFixed(3);
}
function gridRank(lv,sec){
  const b=GRID_LEVELS[lv].bands;
  if(sec<=b[0])return 'S';
  if(sec<=b[1])return 'A';
  if(sec<=b[2])return 'B';
  if(sec<=b[3])return 'C';
  return 'D';
}
function shuffleGrid(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t;}
  return a;
}

      <div class="eg-levelgrid">${rows}</div>

function stopGridLevel(){
  if(gridRafId){cancelAnimationFrame(gridRafId); gridRafId=null;}
  gridState=null;
}
function startGridLevel(lv){
  const def=GRID_LEVELS[lv];
  gridState={lv,def,order:shuffleGrid(def.list),currentIndex:0,misses:0,startTime:null,locked:true};
  gridPanel.innerHTML=`
    <div class="eg-hud">
      <div class="eg-timer" id="egTimer">00:00.0</div>
      <div class="eg-miss">MISS <b id="egMiss">0</b></div>
    </div>
    <div class="eg-target">
      <div><div class="eg-target-label">次にタップ</div><div class="eg-target-symbol" id="egSymbol">-</div><div class="eg-target-name" id="egName"></div></div>
      <div class="eg-target-z">原子番号<b id="egZ">-</b></div>
    </div>
    <div class="eg-fieldwrap">
      <div class="eg-field eg-pre-start" id="egField" style="grid-template-columns:repeat(${def.cols},1fr)"></div>
      <div class="eg-countdown active" id="egCountdown"><div class="eg-countdown-num" id="egCountNum">3</div></div>
    </div>
    <button class="bigbtn secondary" id="egQuit" style="margin-top:12px">やめる</button>`;
  const field=document.getElementById('egField');
  gridState.order.forEach(el=>{
    const d=document.createElement('button');
    d.className='eg-tile';
    d.textContent=el.s;
    d.style.setProperty('--tile-color', el.cat==='metal'?'var(--eg-metal)':'var(--eg-nonmetal)');
    d.addEventListener('click',()=>onGridTileTap(el,d));
    field.appendChild(d);
  });
  updateGridTarget();
  document.getElementById('egQuit').addEventListener('click',()=>{
    stopGridLevel();
    renderGridHome();
  });
  runGridCountdown();
}
function updateGridTarget(){
  const def=gridState.def, idx=gridState.currentIndex;
  if(idx>=def.list.length)return;
  const el=def.list[idx];
  document.getElementById('egSymbol').textContent=el.s;
  document.getElementById('egName').textContent=el.n;
  document.getElementById('egZ').textContent=el.z;
}
function runGridCountdown(){
  const st=gridState;
  const overlay=document.getElementById('egCountdown'), numEl=document.getElementById('egCountNum');
  const steps=['3','2','1','START'];
  let i=0;
  function showNext(){
    if(gridState!==st)return;
    numEl.textContent=steps[i];
    numEl.style.animation='none'; void numEl.offsetWidth; numEl.style.animation='';
    i++;
    if(i<steps.length){ setTimeout(showNext,600); }
    else{
      setTimeout(()=>{
        overlay.classList.remove('active');
        if(gridState!==st)return;
        const f=document.getElementById('egField'); if(f)f.classList.remove('eg-pre-start');
        st.locked=false;
        st.startTime=performance.now();
        gridTick();
      },450);
    }
  }
  showNext();
}
function gridTick(){
  if(!gridState||!gridState.startTime)return;
  const elapsed=(performance.now()-gridState.startTime)/1000;
  const timerEl=document.getElementById('egTimer');
  if(timerEl)timerEl.textContent=fmtGridTime(elapsed);
  gridRafId=requestAnimationFrame(gridTick);
}
function onGridTileTap(el,tileEl){
  if(!gridState||gridState.locked||tileEl.classList.contains('eg-correct'))return;
  const expected=gridState.def.list[gridState.currentIndex];
  if(el.z===expected.z){
    tileEl.classList.add('eg-correct');
    gridState.currentIndex++;
    if(gridState.currentIndex>=gridState.def.list.length){ finishGridLevel(); }
    else{ updateGridTarget(); }
  }else{
    tileEl.classList.remove('eg-wrong'); void tileEl.offsetWidth; tileEl.classList.add('eg-wrong');
    gridState.misses++;
    const missEl=document.getElementById('egMiss'); if(missEl)missEl.textContent=gridState.misses;
    if(navigator.vibrate){try{navigator.vibrate(60);}catch(e){}}
    setTimeout(()=>tileEl.classList.remove('eg-wrong'),320);
  }
}
function finishGridLevel(){
  if(gridRafId){cancelAnimationFrame(gridRafId); gridRafId=null;}
  const st=gridState;
  const elapsed=(performance.now()-st.startTime)/1000;
  const rank=gridRank(st.lv,elapsed);
  const prevBest=getGridBest(st.lv);
  const isRecord=!prevBest||elapsed<prevBest;
  const roundedSec=Math.round(elapsed*1000)/1000;
  addGridResult(st.lv,roundedSec,rank);
  const kind=st.def.kind;
  const lbSubmit=LB.currentUser()?LB.submitScore(kind, st.def.list.length, roundedSec, rank):Promise.resolve();
  const selfBestList=gridBestList(st.lv);
  gridPanel.innerHTML=`
    <h2>結果発表</h2>
    <div class="card-ui" style="text-align:center">
      <div class="score-line" style="font-size:17px">${st.def.label}クリア!</div>
      <div class="rankbig rank-${rank}">${rank}</div>
      <div class="score-line" style="font-family:'JetBrains Mono',monospace">${fmtGridTime(elapsed)}${isRecord?' 🆕':''}</div>
      <div class="muted">MISS ${st.misses}回 ・ BEST ${fmtGridTime(isRecord?elapsed:prevBest)}</div>
      <button class="bigbtn" id="egRetry">もう一度</button>
      <button class="bigbtn secondary" id="egBack">レベル選択に戻る</button>
    </div>
    <div class="card-ui" id="lbBox"></div>
    <div class="card-ui"><b>🏆 自己ベストTOP3</b>${LB.renderSelfBestHTML(selfBestList,kind)}</div>`;
  document.getElementById('egRetry').addEventListener('click',()=>startGridLevel(st.lv));
  document.getElementById('egBack').addEventListener('click',renderGridHome);
  refreshGridLbBox(kind);
  lbSubmit.then(()=>refreshGridLbBox(kind));

,"genre":"酸と塩基・酸化還元","difficulty":"easy","statement":"水酸化ナトリウム水溶液は赤色リトマス紙を青色に変える。","answer":true,"explanation":"塩基性の水溶液は赤色リトマス紙を青色に変える。"},{"id":"q144","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"塩は酸から生じる陰イオンと塩基から生じる陽イオンからできている。","answer":true,"explanation":"塩の成り立ちそのものである。"},{"id":"q145","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"0.10mol/Lの酢酸水溶液のpHがちょうど3のとき、電離度は1.0×10<sup>-2</sup>である。","answer":true,"explanation":"[H<sup>+</sup>]=1.0×10<sup>-3</sup>mol/Lより、電離度＝1.0×10<sup>-3</sup>/0.10=1.0×10<sup>-2</sup>となる。"},{"id":"q146","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"強酸に弱塩基を滴下していく中和滴定では、開始時のpHは7より大きい。","answer":false,"explanation":"強酸から始めるので開始時のpHは1に近い小さな値である。"},{"id":"q147","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"強酸と弱塩基からなる塩の水溶液は、中和点で酸性を示す。","answer":true,"explanation":"強酸+弱塩基の中和滴定における中和点は酸性側にある。"},{"id":"q148","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"硝酸を酸化還元滴定の酸性化に用いないのは、硝酸自身が酸化剤としてはたらき正確な量的関係を得られなくなるためである。","answer":true,"explanation":"硝酸は酸化力をもつため、酸性化には一般に希硫酸が用いられる。"},{"id":"q149","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"リン酸H<sub>3</sub>PO<sub>4</sub>は3価の酸である。","answer":true,"explanation":"リン酸はH<sup>+</sup>になれるHを3つもつ3価の酸である。"},{"id":"q150","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"5.0×10<sup>-4</sup>mol/Lの水酸化バリウム水溶液（完全電離）のpHは11である。","answer":true,"explanation":"[OH<sup>-</sup>]=1.0×10<sup>-3</sup>mol/Lとなり、pHは11となる。"},{"id":"q151","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"フェノールフタレイン溶液を加えて赤色を示す水溶液は、炭酸ナトリウム水溶液である。","answer":true,"explanation":"炭酸ナトリウムは弱酸と強塩基の正塩で水溶液は塩基性を示し、フェノールフタレインが赤色になる。"},{"id":"q152","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"硫酸水素ナトリウムの水溶液は塩基性を示す。","answer":false,"explanation":"硫酸水素ナトリウムは酸性塩で、電離によりH<sup>+</sup>を生じるため水溶液は酸性を示す。"},{"id":"q153","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"easy","statement":"中和滴定で使うビュレットは滴下量を正確に測定するための器具である。","answer":true,"explanation":"ビュレットの用途そのものである。"},{"id":"q154","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"強酸と強塩基が中和すると生じる正塩の水溶液は中性を示す。","answer":true,"explanation":"強酸+強塩基からなる正塩は中性を示す（例：NaCl水溶液）。"},{"id":"q155","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"弱酸と強塩基からなる正塩の水溶液は酸性を示す。","answer":false,"explanation":"弱酸と強塩基からなる正塩の水溶液は塩基性を示す。"},{"id":"q156","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"easy","statement":"メチルオレンジは酸性側で変色する指示薬である。","answer":true,"explanation":"メチルオレンジの変色域はpH3.1〜4.4であり酸性側にある。"},{"id":"q157","year":"2015","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"中和反応は酸と塩基が反応して塩と水を生じる反応である。","answer":true,"explanation":"中和反応の基本定義である。"},{"id":"q158","year":"2016","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"電離度が1に近い酸を弱酸という。","answer":false,"explanation":"電離度が1に近い（ほぼ完全に電離する）酸は強酸という。"},{"id":"q159","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"物質が酸素を受け取ったとき、その物質は酸化されたという。","answer":true,"explanation":"酸化の定義の一つである。"},{"id":"q160","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"物質が水素を失ったとき、その物質は還元されたという。","answer":false,"explanation":"物質が水素を失うと酸化されたという。水素を受け取ると還元されたという。"},{"id":"q161","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"酸化された物質は電子を失っている。","answer":true,"explanation":"酸化＝電子を失うことに対応する。"},{"id":"q162","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"hard","statement":"過マンガン酸カリウムKMnO<sub>4</sub>中のマンガン原子の酸化数は+7である。","answer":true,"explanation":"K=+1、O=-2×4を使い計算するとMnは+7になる。"},{"id":"q163","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"硝酸イオンNO<sub>3</sub><sup>-</sup>中の窒素原子の酸化数は+5である。","answer":true,"explanation":"O=-2×3、電荷-1から逆算するとNは+5になる。"},{"id":"q164","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"二酸化硫黄は酸化剤としても還元剤としてもはたらくことができる物質である。","answer":true,"explanation":"SO<sub>2</sub>は反応相手により酸化剤にも還元剤にもなる。"},{"id":"q165","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"銀は希硝酸や熱濃硫酸のような酸化力の強い酸には反応して溶ける。","answer":true,"explanation":"銀はイオン化傾向が水素より小さいが、酸化力の強い酸には溶ける。"},{"id":"q166","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"アルミニウムは濃硝酸に入れると表面に酸化被膜（不動態）を形成し反応が進まなくなる。","answer":true,"explanation":"Al, Fe, Niなどは濃硝酸で不動態となる。"},{"id":"q167","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"金は塩酸や硝酸とは反応しないが王水とは反応する。","answer":true,"explanation":"金は極めてイオン化傾向が小さいが、酸化力の強い王水には溶ける。"},{"id":"q168","year":"2019","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"電池の両電極間に生じる電位差（電圧）を起電力という。","answer":true,"explanation":"起電力の定義そのものである。"},{"id":"q169","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"電離度とは、溶けている酸や塩基の物質量に対する電離している物質量の割合である。","answer":true,"explanation":"電離度の定義（酸化還元の項でも重要語として再掲）。"},{"id":"q170","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"hard","statement":"H<sub>2</sub>SO<sub>4</sub>中の硫黄原子の酸化数は+6である。","answer":true,"explanation":"H=+1×2、O=-2×4を使って逆算するとSは+6になる。"},{"id":"q171","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"亜鉛は鉄よりもイオン化傾向が小さいため、トタンでは亜鉛が先に腐食して鉄を保護する。","answer":false,"explanation":"亜鉛は鉄よりもイオン化傾向が大きいため先に酸化されて鉄を保護する。"},{"id":"q172","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"Fe<sup>2+</sup>がFe<sup>3+</sup>に変化する反応はFe<sup>2+</sup> → Fe<sup>3+</sup> + e<sup>-</sup>と表され、Fe<sup>2+</sup>は還元されている。","answer":false,"explanation":"電子を失っているのでFe<sup>2+</sup>は酸化されている。"},{"id":"q173","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"水素と酸素を用いる燃料電池では酸素側の電極が正極となる。","answer":true,"explanation":"酸素は還元されて電子を受け取るため正極となる。"},{"id":"q174","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"燃料電池が放電するとき、電流は正極から負極（外部回路）へ流れる。","answer":true,"explanation":"電流の向きは電子の流れと逆で、正極から負極へ流れる。"},{"id":"q175","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"硫酸で酸性にしたヨウ化カリウム水溶液に過酸化水素水を加える反応で、ヨウ化物イオンは還元されている。","answer":false,"explanation":"ヨウ化物イオンI<sup>-</sup>は電子を失いI<sub>2</sub>になっているため酸化されている。"},{"id":"q176","year":"2020","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"アルミニウムと鉄は高温の水蒸気と反応する金属である。","answer":true,"explanation":"イオン化傾向の大きいAl, Feは高温の水蒸気と反応する。"},{"id":"q177","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"物質やイオンが酸化されている反応の例として、2Na+Cl<sub>2</sub>→2NaClにおけるNaが挙げられる。","answer":true,"explanation":"Naは電子を失いNa<sup>+</sup>になっているため酸化されている。"},{"id":"q178","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"二クロム酸カリウムは酸化剤としてはたらく。","answer":true,"explanation":"Cr<sub>2</sub>O<sub>7</sub><sup>2-</sup>は電子を受け取りCr<sup>3+</sup>になり酸化剤としてはたらく。"},{"id":"q179","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"ブレンステッド・ローリーの定義で、酸とは水素イオンを与える物質である。","answer":true,"explanation":"先述の酸・塩基定義の確認である。"},{"id":"q180","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"無極性分子He、Neのうち、沸点が高いのはHeである。","answer":false,"explanation":"分子量が大きいNeの方がファンデルワールス力が強く沸点が高い。"},{"id":"q181","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"酸化と還元には酸素の授受、水素の授受、電子の授受による3つの定義がある。","answer":true,"explanation":"本文の記述どおりである。"},{"id":"q182","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"電池から電流を取り出すことを充電という。","answer":false,"explanation":"電池から電流を取り出すことは放電であり、外部から逆向きに電流を流し起電力を回復させることが充電である。"},{"id":"q183","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"電池で電子が流れ出す電極を負極という。","answer":true,"explanation":"負極の定義そのものである。"},{"id":"q184","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"0.50molの硫化水素が二酸化硫黄とすべて反応すると、生成する硫黄は0.75molである。","answer":true,"explanation":"反応式の係数比の計算により0.75molとなる。"},{"id":"q185","year":"2021","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"金属A、B、Cが亜鉛、銀、銅のいずれかで、金属Bの表面に金属Aが析出し金属Cには変化がない場合、イオン化傾向はB>A>Cとなる。","answer":true,"explanation":"析出関係からこの順になる（本問ではA=Cu, B=Zn, C=Ag）。"},{"id":"q186","year":"2022","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"MnO<sub>2</sub>+4HCl→MnCl<sub>2</sub>+Cl<sub>2</sub>+ ,"explanation":"電子は亜鉛板から銅板へ流れるが、電流はその逆向き（銅板から亜鉛板）に流れる。"},{"id":"q197","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"ダニエル電池を長く放電させるには硫酸銅(II)水溶液の濃度を高くする方がよい。","answer":true,"explanation":"正極側のCu<sup>2+</sup>濃度が高い方が長時間の放電に有利である。"},{"id":"q198","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"亜鉛はダニエル電池の正極活物質としてはたらく。","answer":false,"explanation":"亜鉛は負極で酸化されるため正極活物質ではなく負極活物質としてはたらく。"},{"id":"q199","year":"2023","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"銅や銀は希硫酸とは反応しないが、加熱した濃硫酸とは反応して二酸化硫黄を発生する。","answer":true,"explanation":"銅・銀は熱濃硫酸と反応しSO<sub>2</sub>を発生する（酸化力による反応）。"},{"id":"q200","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"酸化数のルールにおいて、単体中の原子の酸化数は常に0である。","answer":true,"explanation":"酸化数の基本ルールの一つである。"},{"id":"q201","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"過酸化水素H<sub>2</sub>O<sub>2</sub>中の酸素原子の酸化数は通常の化合物と同じく-2である。","answer":false,"explanation":"過酸化水素は例外で、酸素原子の酸化数は-1である。"},{"id":"q202","year":"2024","genre":"酸と塩基・酸化還元","difficulty":"easy","statement":"金属のイオン化傾向はLiが最大でAuが最小である。","answer":true,"explanation":"イオン化列 Li>K>Ca>Na>Mg>Al>Zn>Fe>Ni>Sn>Pb>(H<sub>2</sub>)>Cu>Hg>Ag>Pt>Auのとおりである。"},{"id":"q203","year":"2015","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"酸化剤は相手を酸化し自身は還元される物質である。","answer":true,"explanation":"酸化剤の定義そのものである。"},{"id":"q204","year":"2016","genre":"酸と塩基・酸化還元","difficulty":"normal","statement":"還元剤は相手を還元し自身は還元される物質である。","answer":false,"explanation":"還元剤は相手を還元し自身は酸化される物質である。"},{"id":"q205","year":"2019","genre":"状態変化・気体の法則・結晶格子","difficulty":"normal","statement":"H<sub>2</sub>とF<sub>2</sub>では、分子量が大きいF<sub>2</sub>の方がファンデルワールス力が大きく沸点が高い。","answer":true,"explanation":"無極性分子では分子量が大きいほどファンデルワールス力が強く沸点が高くなる。"},{"id":"q206","year":"2019","genre":"状態変化・気体の法則・結晶格子","difficulty":"normal","statement":"F<sub>2</sub>とHClでは、HClの方が沸点が高いのはHClの分子間に共有結合が形成されているためである。","answer":false,"explanation":"HClの分子間には共有結合ではなく極性による強い分子間力（双極子間力）が働いており、それが沸点上昇の要因である。"},{"id":"q20   const stats=loadRunnerStats();
  if(!stats[qid]) stats[qid]={shown:0,correct:0};
  stats[qid].shown++;
  if(isCorrect) stats[qid].correct++;
  try{ localStorage.setItem(RUNNER_STATS_KEY,JSON.stringify(stats)); }catch(e){}
}
function loadRunnerCatStats(){
  try{ const raw=localStorage.getItem(RUNNER_CAT_KEY); return raw?JSON.parse(raw):{catStats:{}}; }catch(e){ return {catStats:{}}; }

  const data=loadRunnerCatStats();

  if(isCorrect) data.catStats[genre].correct++;
  try{ localStorage.setItem(RUNNER_CAT_KEY,JSON.stringify(data)); }catch(e){}
  LB.pushState(RUNNER_CAT_KEY,data);
}
function runnerRank(correct){
  return correct>=50?'SS':correct>=30?'S':correct>=20?'A':correct>=10?'B':correct>=3?'C':'D';
}
function shuffleRunner(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildRunnerPool(genre){
  let base = genre==='all' ? RUNNER_QUESTIONS : RUNNER_QUESTIONS.filter(q=>q.genre===genre);
  if(base.length<5) base=RUNNER_QUESTIONS;
  return shuffleRunner(base);
}

    b.addEventListener('click',()=>{ selectedRunnerGenre=b.dataset.g; renderRunnerHome(); });
  });
  runnerPanel.querySelectorAll('.eg-levelbtn').forEach(b=>{
    b.addEventListener('click',()=>startRunner(b.dataset.diff));
  });
  refreshRunnerLbBox('runnerScore');
}

function startRunner(diffKey){
  const def=RUNNER_DIFFS[diffKey];
  runnerState={
    pool:buildRunnerPool(selectedRunnerGenre), idx:0,
    lives:def.lives, maxLives:def.lives,
    diff:diffKey, genre:selectedRunnerGenre,
    streak:0, bestStreak:0, correct:0, total:0,
    answered:false, timerInterval:null, autoAdvanceTimeout:null, timeLeft:0,
    history:[], startTime:Date.now(), locked:false, el:null
  };
  renderRunnerPlayShell();
  runnerNextQuestion();
}

function renderRunnerPlayShell(){
  runnerPanel.innerHTML=`
    <div class="card-ui" style="padding:0;overflow:hidden">
      <div class="rn-track">
        <div class="rn-cloud" style="top:8px;left:220px;animation-duration:16s;">☁️</div>
        <div class="rn-cloud" style="top:24px;left:90px;animation-duration:22s;">☁️</div>
        <div class="rn-hill rn-hill1"></div>
        <div class="rn-hill rn-hill2"></div>
        <div class="rn-wall" id="rnWall"></div>
        <div class="rn-runner" id="rnRunner">
          <div class="rn-arm rn-arm-back"></div>
          <div class="rn-leg rn-leg-back"></div>
          <div class="rn-torso"></div>
          <div class="rn-head"></div>
          <div class="rn-leg rn-leg-front"></div>
          <div class="rn-arm rn-arm-front"></div>
        </div>
        <div class="rn-ground-wrap">
          <div class="rn-ground-strip"></div>
          <div class="rn-ground-strip"></div>
        </div>
      </div>
    </div>
    <div class="card-ui">
      <div class="rn-hud">
        <span>連続正解 <b id="rnStreak">0</b>（最高 <b id="rnBest">0</b>）</span>
        <span class="life-hearts" id="rnHearts" style="letter-spacing:2px"></span>
      </div>
      <span class="rn-genretag" id="rnGenreTag">-</span>
      <div class="rn-timer-row">⏱ <span id="rnTimerNum">10</span>秒</div>
      <div class="rn-timer-bar"><div class="rn-timer-fill" id="rnTimerFill"></div></div>
      <div class="rn-statement" id="rnStatement"></div>
      <div class="rn-feedback" id="rnFeedback"></div>
      <div class="rn-answer-row">
        <button class="rn-ans-btn true-btn" id="rnBtnTrue">○<small>正しい</small></button>
        <button class="rn-ans-btn false-btn" id="rnBtnFalse">×<small>誤り</small></button>
      </div>
      <button class="bigbtn secondary" id="rnQuit" style="margin-top:10px">やめる</button>
    </div>`;
  runnerState.el={
    wall:document.getElementById('rnWall'), runner:document.getElementById('rnRunner'),
    timerFill:document.getElementById('rnTimerFill'), timerNum:document.getElementById('rnTimerNum'),
    streak:document.getElementById('rnStreak'), best:document.getElementById('rnBest'),
    hearts:document.getElementById('rnHearts'), genreTag:document.getElementById('rnGenreTag'),
    statement:document.getElementById('rnStatement'), feedback:document.getElementById('rnFeedback'),
    btnTrue:document.getElementById('rnBtnTrue'), btnFalse:document.getElementById('rnBtnFalse')
  };
  runnerState.el.btnTrue.addEventListener('click',()=>runnerAnswer(true));
  runnerState.el.btnFalse.addEventListener('click',()=>runnerAnswer(false));
  document.getElementById('rnQuit').addEventListener('click',()=>{ stopRunner(); renderRunnerHome(); });
}

function stopRunner(){
  clearRunnerTimer();
  runnerState=null;
}

function clearRunnerTimer(){
  if(!runnerState) return;
  if(runnerState.timerInterval){ clearInterval(runnerState.timerInterval); runnerState.timerInterval=null; }
  if(runnerState.autoAdvanceTimeout){ clearTimeout(runnerState.autoAdvanceTimeout); runnerState.autoAdvanceTimeout=null; }
}

function runnerUpdateWall(){
  const st=runnerState;
  const gapFar=200, gapNear=34;
  const missCount=st.maxLives-st.lives;
  const ratio=st.maxLives>0?Math.min(1,missCount/st.maxLives):0;
  const gap=gapFar-ratio*(gapFar-gapNear);
  st.el.wall.style.left=(26+gap)+'px';
}

function runnerHeartsHTML(){
  let s='';
  for(let i=0;i<runnerState.maxLives;i++) s+= i<runnerState.lives ? '❤️' : '🖤';
  return s;
}

function runnerRenderHUD(){
  const st=runnerState;
  st.el.streak.textContent=st.streak;
  st.el.best.textContent=st.bestStreak;
  st.el.hearts.innerHTML=runnerHeartsHTML();
}

function runnerUpdateTimerVisual(ratio){
  const st=runnerState;
  st.el.timerFill.style.width=(ratio*100)+'%';
  st.el.timerFill.style.background = ratio>.5?'#06d6a0':ratio>.2?'#ffd166':'#ef476f';
  st.el.timerNum.textContent=Math.max(0,Math.ceil(st.timeLeft/1000));
  const speedFactor=0.45+ratio*0.55;
  document.documentElement.style.setProperty('--rn-legdur',(0.38*speedFactor)+'s');
  document.documentElement.style.setProperty('--rn-grounddur',(0.55*speedFactor)+'s');
}

function startRunnerTimer(){
  clearRunnerTimer();
  const st=runnerState;
  st.timeLeft=RUNNER_QUESTION_TIME_MS;
  runnerUpdateTimerVisual(1);
  const tickMs=100;
  st.timerInterval=setInterval(()=>{
    st.timeLeft-=tickMs;
    const ratio=Math.max(0,st.timeLeft/RUNNER_QUESTION_TIME_MS);
    runnerUpdateTimerVisual(ratio);
    if(st.timeLeft<=0){
      clearInterval(st.timerInterval); st.timerInterval=null;
      if(!st.answered) runnerAnswer(null);
    }
  },tickMs);
}

function runnerGoNext(){
  clearRunnerTimer();
  runnerState.idx++;
  runnerNextQuestion();
}

function runnerNextQuestion(){
  const st=runnerState;
  st.answered=false;
  st.el.feedback.style.display='none';
  st.el.feedback.className='rn-feedback';
  st.el.btnTrue.disabled=false;
  st.el.btnFalse.disabled=false;
  if(st.idx>=st.pool.length){ st.pool=shuffleRunner(st.pool); st.idx=0; }
  const q=st.pool[st.idx];
  st.el.genreTag.textContent=q.genre;
  st.el.statement.innerHTML=(q.svg||'')+q.statement;
  st.el.runner.classList.remove('hit','crash');
  startRunnerTimer();
}

function runnerCurrentQ(){ return runnerState.pool[runnerState.idx]; }

function runnerAnswer(userAnswer){
  const st=runnerState;
  if(!st||st.answered) return;
  clearRunnerTimer();
  st.answered=true;
  const q=runnerCurrentQ();
  const isTimeout = userAnswer===null;
  const correct = !isTimeout && (userAnswer===q.answer);
  st.total++;
  recordRunnerAnswer(q.id,correct);
  recordRunnerGenreAnswer(q.genre,correct);
  if(typeof LB!=='undefined') LB.recordQuizResults('chemrunner',[{id:q.id,ok:correct}]);
  st.history.push({qid:q.id,genre:q.genre,statement:q.statement,explanation:q.explanation,correct});
  st.el.btnTrue.disabled=true;
  st.el.btnFalse.disabled=true;
  const fb=st.el.feedback;
  fb.style.display='block';
  if(correct){
    st.correct++; st.streak++; st.bestStreak=Math.max(st.bestStreak,st.streak);
    fb.className='rn-feedback correct';
    fb.innerHTML=`⭕ 正解! ${q.explanation}`;
    st.el.runner.classList.add('boost');
    setTimeout(()=>st.el.runner.classList.remove('boost'),300);
  }else{
    st.streak=0; st.lives--;
    fb.className='rn-feedback wrong';
    fb.innerHTML = isTimeout
      ? `⏰ 時間切れ! 正解は「${q.answer?'正しい(○)':'誤り(×)'}」。 ${q.explanation}`
      : `❌ 残念、正解は「${q.answer?'正しい(○)':'誤り(×)'}」。 ${q.explanation}`;
    st.el.runner.classList.add('hit');
  }
  runnerUpdateWall();
  runnerRenderHUD();
  if(st.lives<=0){
    st.el.wall.style.left='30px';
    setTimeout(()=>{ st.el.runner.classList.remove('hit'); st.el.runner.classList.add('crash'); },380);
    setTimeout(finishRunner,1200);
  }else{
    st.autoAdvanceTimeout=setTimeout(runnerGoNext,1500);
  }
}

function finishRunner(){
  const st=runnerState;
  if(!st) return;
  clearRunnerTimer();
  const rate = st.total ? Math.round(st.correct/st.total*100) : 0;
  const sec = Math.floor((Date.now()-st.startTime)/1000);
  const eligible = st.diff==='hard' && st.genre==='all';
  const rank = eligible ? runnerRank(st.correct) : null;
  if(eligible){
    if(!state.bestList) state.bestList={score:[],time:[]};
    if(!state.bestList.runnerScore) state.bestList.runnerScore=[];
    const list=state.bestList.runnerScore;
    list.push({correct:st.correct,sec,rank});
    list.sort((a,b)=>(b.correct-a.correct)||(a.sec-b.sec));
    state.bestList.runnerScore=list.slice(0,3);
    save();
  }
  lastRunnerRun={history:st.history,correct:st.correct,total:st.total,rate,diff:st.diff,genre:st.genre,rank,bestStreak:st.bestStreak};
  const lbSubmit=(eligible&&LB.currentUser())?LB.submitScore('runnerScore',st.correct,sec,rank):Promise.resolve();
  runnerState=null;
  renderRunnerResult();
  if(eligible){ refreshRunnerLbBox('runnerScore'); lbSubmit.then(()=>refreshRunnerLbBox('runnerScore')); }
}

function refreshRunnerLbBox(kind){
  const box=document.getElementById('lbBox');
  if(!box) return;
  if(LB.currentUser()){
    box.innerHTML=`<b>🌏 全国ランキング TOP10</b><div class="lb-loading">読み込み中...</div>`;
    LB.fetchTop(kind,10).then(list=>{
      const b=document.getElementById('lbBox');
      if(b) b.innerHTML=`<b>🌏 全国ランキング TOP10</b>`+LB.renderBoardHTML(list,LB.currentUser().uid,kind);
    });
  }else{
    box.innerHTML=`<b>🌏 全国ランキング</b><div class="lb-cta">ログインすると、他の人と全国ランキングで競えます。</div><button class="bigbtn secondary" id="lbRegisterBtnRunner" style="width:100%">ログインする</button>`;
    document.getElementById('lbRegisterBtnRunner').onclick=()=>LB.openAccountModal();
  }
}

function renderRunnerResult(){
  const r=lastRunnerRun;
  const rankHtml = r.rank ? `<div class="rankbig rank-${r.rank}">${r.rank}</div>` : '';
  const selfBestList=(state.bestList&&state.bestList.runnerScore)||[];
  runnerPanel.innerHTML=`
    <h2>結果発表</h2>
    <div class="card-ui" style="text-align:center">
      ${rankHtml}
      <div class="score-line">${r.correct}問正解</div>
      <div class="muted">正答率 ${r.rate}%・最高連続正解 ${r.bestStreak}・回答数 ${r.total}</div>
      <button class="bigbtn" id="rnRetry">もう一度</button>
      <button class="bigbtn secondary" id="rnReview">📋 今回の問題を振り返る</button>
      <button class="bigbtn secondary" id="rnBack">モード選択に戻る</button>
    </div>
    ${r.rank?`<div class="card-ui" id="lbBox"></div>${selfBestList.length?`<div class="card-ui"><b>🏆 自己ベストTOP3</b>${LB.renderSelfBestHTML(selfBestList,'runnerScore')}</div>`:''}`:''}`;
  document.getElementById('rnRetry').addEventListener('click',()=>startRunner(r.diff));
  document.getElementById('rnReview').addEventListener('click',renderRunnerReview);
  document.getElementById('rnBack').addEventListener('click',renderRunnerHome);
}

function renderRunnerReview(){
  const r=lastRunnerRun;
  const history=(r&&r.history)||[];
  let listHtml;
  if(history.length===0){
    listHtml='<div class="muted" style="text-align:center;padding:20px 0">振り返る問題がありません。</div>';
  }else{
    const wrong=history.filter(h=>!h.correct);
    const rest=history.filter(h=>h.correct);
    listHtml=wrong.concat(rest).map(h=>`
      <div class="rn-review-item ${h.correct?'':'is-wrong'}">
        <div class="rv-head"><span>${h.genre}</span><span class="rv-mark ${h.correct?'correct':'wrong'}">${h.correct?'○ 正解':'× 不正解'}</span></div>
        <div class="rv-statement">${h.statement}</div>
        <div class="rv-explanation">${h.explanation}</div>
      </div>`).join('');
  }
  runnerPanel.innerHTML=`
    <h2>📋 今回の振り返り</h2>
    <div id="rnReviewList">${listHtml}</div>
    <button class="bigbtn secondary" id="rnReviewBack">戻る</button>`;
  document.getElementById('rnReviewBack').addEventListener('click',renderRunnerResult);
}

/* ================= 確認ダイアログ ================= */
function confirmDialog(message,onConfirm){
  infoSheet.innerHTML=`<h3>確認<button class="closex" onclick="infoModal.classList.remove('open')">✕</button></h3>
    <div style="font-size:13.5px;line-height:1.8;margin-bottom:6px">${message}</div>
    <button class="bigbtn amber" id="confirmYes">終了する</button>
    <button class="bigbtn secondary" id="confirmNo">続ける</button>`;
  infoModal.classList.add('open');
  document.getElementById('confirmYes').onclick=()=>{infoModal.classList.remove('open');onConfirm();};
  document.getElementById('confirmNo').onclick=()=>infoModal.classList.remove('open');
}

/* ================= ナビ・共通 ================= */
const VIEW_TITLES={challenge:'チャレンジモード',grid:'🔢 元素グリッド',runner:'🏃 化学ランナー',weak:'🎯 弱点特訓'};
function switchView(view){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  const t=document.getElementById('hdrTitle');
  if(VIEW_TITLES[view]){t.style.display='';t.textContent=VIEW_TITLES[view];}
  else t.style.display='none';
  if(view==='home'&&!catDrill)renderHome();
  if(view==='challenge'&&(!chal||chal.over))renderChallengeHome();
  if(view==='grid'&&!gridState)renderGridHome();
  if(view==='runner'&&!runnerState)renderRunnerHome();
  if(view==='weak'&&!drill)renderWeakHome();
}
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    const target=b.dataset.view;
    const activeView=document.querySelector('.view.active').id.replace('view-','');
    if(activeView==='challenge'&&target!=='challenge'&&chal&&!chal.over){
      confirmDialog('チャレンジを終了しますか？記録は保存されません。',()=>{
        stopChalTimer(); chal.over=true; chal=null;
        switchView(target);
      });
      return;
    }
    if(activeView==='grid'&&target!=='grid'&&gridState&&!gridState.locked){
      confirmDialog('元素グリッドを終了しますか？記録は保存されません。',()=>{
        stopGridLevel();
        switchView(target);
      });
      return;
    }
    if(activeView==='runner'&&target!=='runner'&&runnerState&&!runnerState.locked){
      confirmDialog('化学ランナーを終了しますか？記録は保存されません。',()=>{
        stopRunner();
        switchView(target);
      });
      return;
    }
    switchView(target);
  });
});
document.getElementById('questSelect').addEventListener('change',e=>{location.href=e.target.value;});

/* ================= 起動 ================= */
load();
updateWeakBadge();
refreshAnswerFxBtn();
refreshAnswerAutoBtn();
renderHome();
</script>
