<meta charset="UTF-8">
<title>元素グリッドEX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:ital,wght@0,600;0,800;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#12181a;
    --bg-deep:#0b0f10;
    --panel:#1a2224;
    --panel-2:#212b2d;
    --line:#2c3739;
    --ink:#eef3f1;
    --ink-dim:#93a4a2;
    --accent:#4fd8c4;
    --accent-ink:#08201c;
    --danger:#ff6b6b;
    --good:#7be08a;

    --c-metal:#ff9457;
    --c-nonmetal:#4fd8c4;

    --font-display:'Big Shoulders', 'Zen Kaku Gothic New', sans-serif;
    --font-body:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  #stage{
    position:relative;
    height:100vh;
    height:100dvh;
    min-height:560px;
    max-width:560px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 18% -10%, rgba(79,216,196,0.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 28px),
      var(--bg);
    overflow:hidden;
  }

  /* ---------- shared ---------- */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .stencil{
    font-family:var(--font-display);
    font-weight:800;
    letter-spacing:0.02em;
    text-wrap:balance;
  }
  button{ font-family:inherit; }

  /* ---------- MENU ---------- */
  #menu{ justify-content:center; gap:0; overflow-y:auto; }
  .menu-head{ padding-top:10px; flex-shrink:0; }
  .menu-title{
    font-size:52px;
    line-height:0.92;
    margin:6px 0 4px;
    color:var(--ink);
    -webkit-text-stroke:0.5px rgba(79,216,196,0.35);
  }
  .menu-sub{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
  }

  .rule-card{
    margin-top:16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .rule-card b{ color:var(--ink); font-weight:700; }

  .level-list{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex-shrink:0;
  }
  .level-card{
    position:relative;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 18px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    transition:border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .level-card:active{ transform:scale(0.98); background:var(--panel-2); }
  .level-card .lc-name{
    font-family:var(--font-display);
    font-weight:800;
    font-size:24px;
    letter-spacing:0.02em;
  }
  .level-card .lc-grid{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--ink-dim);
    letter-spacing:0.06em;
    margin-left:8px;
  }
  .level-card .lc-range{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:2px;
    letter-spacing:0.04em;
  }
  .level-card.lv-basic{ border-color:rgba(79,216,196,0.35); }
  .level-card.lv-mid{ border-color:rgba(155,126,222,0.35); }
  .level-card.lv-advanced{ border-color:rgba(232,93,158,0.35); }
  .lc-best{
    text-align:right;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .lc-best .lc-best-val{
    display:block;
    font-size:17px;
    color:var(--accent);
    font-weight:700;
  }
  .level-card.lv-mid .lc-best-val{ color:#9b7ede; }
  .level-card.lv-advanced .lc-best-val{ color:#e85d9e; }

  .legend{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    flex-shrink:0;
  }
  .legend-item{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-dim);
    font-family:var(--font-mono);
  }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* ---------- PLAY ---------- */
  #play{ display:none; padding:14px 14px calc(10px + env(safe-area-inset-bottom)); }
  #play.active{ display:flex; }

  .hud{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 2px 12px;
    flex-shrink:0;
  }
  .hud-quit{
    width:34px; height:34px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink-dim);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .hud-mid{ flex:1; min-width:0; }
  .hud-timer{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:22px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .hud-progress-track{
    margin-top:6px;
    height:5px;
    border-radius:3px;
    background:var(--panel-2);
    overflow:hidden;
  }
  .hud-progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:3px;
    transition:width 0.25s ease;
  }
  .hud-miss{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--danger);
    text-align:right;
    flex-shrink:0;
    min-width:44px;
  }
  .hud-miss b{ font-size:18px; display:block; line-height:1; }

  .target-pill{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 16px;
    margin-bottom:12px;
  }
  .target-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .target-symbol{
    font-family:var(--font-display);
    font-weight:800;
    font-size:34px;
    line-height:1;
    min-width:1.6ch;
  }
  .target-name{
    font-size:14px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .target-z{
    margin-left:auto;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:right;
  }
  .target-z b{ display:block; font-size:20px; color:var(--ink); }

  #field{
    position:relative;
    flex:1;
    min-height:0;
    border-radius:16px;
    border:1px solid var(--line);
    background:
      radial-gradient(circle at 30% 20%, rgba(79,216,196,0.06), transparent 60%),
      var(--bg-deep);
    overflow:hidden;
  }
  #field.pre-start .tile{ opacity:0; }

  .countdown-overlay{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(11,15,16,0.72);
    backdrop-filter:blur(2px);
    z-index:20;
    pointer-events:none;
  }
  .countdown-overlay.active{ display:flex; }
  .countdown-num{
    font-size:110px;
    color:var(--accent);
    text-shadow:0 0 30px rgba(79,216,196,0.5);
    animation:countpop .5s ease-out;
  }
  @keyframes countpop{
    0%{ transform:scale(0.4); opacity:0; }
    60%{ transform:scale(1.1); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .tile{
    position:absolute;
    transform:translate(-50%,-50%);
    width:60px; height:60px;
    border-radius:14px;
    border:1.5px solid var(--tile-color, var(--accent));
    background:var(--panel);
    color:var(--ink);
    font-family:var(--font-display);
    font-weight:800;
    font-size:19px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 transparent, inset 0 0 14px -4px var(--tile-color, var(--accent));
    transition:transform 0.12s ease, opacity 0.25s ease, box-shadow 0.15s ease;
    touch-action:manipulation;
  }
  .tile:active{ transform:translate(-50%,-50%) scale(0.9); }
  .tile.correct{
    animation:pop 0.4s ease forwards;
    pointer-events:none;
  }
  .tile.wrong{
    animation:shake 0.32s ease;
    border-color:var(--danger);
    box-shadow:inset 0 0 16px -3px var(--danger);
  }
  @keyframes pop{
    0%{ transform:translate(-50%,-50%) scale(1); }
    40%{ transform:translate(-50%,-50%) scale(1.2); box-shadow:0 0 22px 4px var(--tile-color, var(--accent)); }
    100%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; }
  }
  @keyframes shake{
    0%,100%{ transform:translate(-50%,-50%); }
    25%{ transform:translate(calc(-50% - 6px),-50%); }
    75%{ transform:translate(calc(-50% + 6px),-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .tile, .tile.correct, .tile.wrong{ animation:none; transition:opacity 0.2s ease; }
    .tile.correct{ opacity:0; }
  }

  /* ---------- RESULT ---------- */
  #result{ display:none; align-items:center; text-align:center; }
  #result.active{ display:flex; }
  .result-inner{ margin:auto; width:100%; }
  .result-eyebrow{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.14em; color:var(--ink-dim); }
  .result-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:44px;
    margin:6px 0 18px;
    color:var(--accent);
  }
  .result-time{
    font-family:var(--font-mono);
    font-size:52px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    line-height:1;
  }
  .result-record{
    display:inline-block;
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--bg);
    background:var(--good);
    padding:4px 10px;
    border-radius:999px;
    font-weight:700;
  }
  .result-stats{
    margin-top:22px;
    display:flex;
    justify-content:center;
    gap:28px;
  }
  .result-stat-label{ font-size:11px; color:var(--ink-dim); font-family:var(--font-mono); }
  .result-stat-val{ font-size:22px; font-weight:700; font-family:var(--font-mono); margin-top:2px; }

  .result-actions{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn{
    border:none;
    border-radius:12px;
    padding:14px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:active{ background:#3fc2af; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); }
  .btn-ghost:active{ background:var(--panel); }
</style>

<div id="stage">

  <!-- MENU -->
  <div id="menu" class="screen">
    <div class="menu-head">
      <div class="eyebrow">元素記号 早押しゲーム・グリッド版</div>
      <h1 class="menu-title stencil">元素<br>グリッドEX</h1>
      <div class="menu-sub">ELEMENT GRID EX — TAP IN ATOMIC ORDER</div>
    </div>

    <div class="rule-card">
      マスに並んだ元素記号を、<b>原子番号の小さい順</b>にタップしていくタイムアタック。レベルが上がるほどマスと元素の数が増える。
    </div>

    <div class="level-list">
      <button class="level-card lv-basic" data-level="basic">
        <span>
          <span class="lc-name stencil">初級</span><span class="lc-grid">3×3</span>
          <span class="lc-range">H → F ・ 9元素</span>
        </span>
        <span class="lc-best" data-best="basic">
          BEST
          <span class="lc-best-val">--:--.-</span>
        </span>
      </button>
      <button class="level-card lv-mid" data-level="mid">
        <span>
          <span class="lc-name stencil">中級</span><span class="lc-grid">4×4</span>
          <span class="lc-range">H → S ・ 16元素</span>
        </span>
        <span class="lc-best" data-best="mid">
          BEST
          <span class="lc-best-val">--:--.-</span>
        </span>
      </button>
      <button class="level-card lv-advanced" data-level="advanced">
        <span>
          <span class="lc-name stencil">上級</span><span class="lc-grid">5×5</span>
          <span class="lc-range">H → Mn ・ 25元素</span>
        </span>
        <span class="lc-best" data-best="advanced">
          BEST
          <span class="lc-best-val">--:--.-</span>
        </span>
      </button>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--c-metal)"></span>金属</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--c-nonmetal)"></span>非金属</span>
    </div>
  </div>

  <!-- PLAY -->
  <div id="play" class="screen">
    <div class="hud">
      <button class="hud-quit" id="quitBtn" aria-label="メニューに戻る">✕</button>
      <div class="hud-mid">
        <div class="hud-timer" id="timerDisp">00:00.0</div>
        <div class="hud-progress-track"><div class="hud-progress-fill" id="progressFill"></div></div>
      </div>
      <div class="hud-miss">MISS<b id="missCount">0</b></div>
    </div>

    <div class="target-pill" id="targetPill">
      <div>
        <div class="target-label">次にタップ</div>
        <div class="target-symbol" id="targetSymbol">H</div>
        <div class="target-name" id="targetName">水素</div>
      </div>
      <div class="target-z">Z<b id="targetZ">1</b></div>
    </div>

    <div id="field"></div>

    <div class="countdown-overlay" id="countdownOverlay">
      <div class="countdown-num stencil" id="countdownNum">3</div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-inner">
      <div class="result-eyebrow">CLEAR</div>
      <div class="result-title stencil" id="resultLevelName">初級クリア!</div>
      <div class="result-time" id="resultTime">00:00.0</div>
      <div id="resultRecordBadge" style="display:none;" class="result-record">NEW RECORD</div>
      <div class="result-stats">
        <div>
          <div class="result-stat-label">MISS</div>
          <div class="result-stat-val" id="resultMiss">0</div>
        </div>
        <div>
          <div class="result-stat-label">BEST</div>
          <div class="result-stat-val" id="resultBest">--:--.-</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" id="retryBtn">もう一度</button>
        <button class="btn btn-ghost" id="backBtn">レベル選択に戻る</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  var ELEMENTS = [
    {s:'H',  n:'水素',       z:1,  cat:'nonmetal'},
    {s:'He', n:'ヘリウム',    z:2,  cat:'nonmetal'},
    {s:'Li', n:'リチウム',    z:3,  cat:'metal'},
    {s:'Be', n:'ベリリウム',  z:4,  cat:'metal'},
    {s:'B',  n:'ホウ素',     z:5,  cat:'nonmetal'},
    {s:'C',  n:'炭素',       z:6,  cat:'nonmetal'},
    {s:'N',  n:'窒素',       z:7,  cat:'nonmetal'},
    {s:'O',  n:'酸素',       z:8,  cat:'nonmetal'},
    {s:'F',  n:'フッ素',     z:9,  cat:'nonmetal'},
    {s:'Ne', n:'ネオン',     z:10, cat:'nonmetal'},
    {s:'Na', n:'ナトリウム',  z:11, cat:'metal'},
    {s:'Mg', n:'マグネシウム',z:12, cat:'metal'},
    {s:'Al', n:'アルミニウム',z:13, cat:'metal'},
    {s:'Si', n:'ケイ素',     z:14, cat:'nonmetal'},
    {s:'P',  n:'リン',       z:15, cat:'nonmetal'},
    {s:'S',  n:'硫黄',       z:16, cat:'nonmetal'},
    {s:'Cl', n:'塩素',       z:17, cat:'nonmetal'},
    {s:'Ar', n:'アルゴン',    z:18, cat:'nonmetal'},
    {s:'K',  n:'カリウム',    z:19, cat:'metal'},
    {s:'Ca', n:'カルシウム',  z:20, cat:'metal'},
    {s:'Sc', n:'スカンジウム',z:21, cat:'metal'},
    {s:'Ti', n:'チタン',     z:22, cat:'metal'},
    {s:'V',  n:'バナジウム',  z:23, cat:'metal'},
    {s:'Cr', n:'クロム',     z:24, cat:'metal'},
    {s:'Mn', n:'マンガン',    z:25, cat:'metal'}
  ];

  var LEVELS = {
    basic:    { label:'初級', cols:3, rows:3, list: ELEMENTS.slice(0,9),  storeKey:'elementGridEx_best_basic' },
    mid:      { label:'中級', cols:4, rows:4, list: ELEMENTS.slice(0,16), storeKey:'elementGridEx_best_mid' },
    advanced: { label:'上級', cols:5, rows:5, list: ELEMENTS.slice(0,25), storeKey:'elementGridEx_best_advanced' }
  };

  var CAT_VAR = {
    metal:'--c-metal', nonmetal:'--c-nonmetal'
  };

  var $ = function(id){ return document.getElementById(id); };
  var menu = $('menu'), playScreen = $('play'), resultScreen = $('result');
  var field = $('field');
  var stageEl = $('stage');

  // Some in-app WebViews miscompute 100dvh (report a much larger value than
  // the real visible viewport). Force the actual pixel height via JS so the
  // stage never grows taller than what's on screen.
  function fixStageHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    stageEl.style.height = Math.max(h, 1) + 'px';
    if(state) layoutTiles();
  }
  window.addEventListener('load', fixStageHeight);
  window.addEventListener('resize', fixStageHeight);
  window.addEventListener('orientationchange', fixStageHeight);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', fixStageHeight);
  fixStageHeight();

  var state = null; // active game state
  var rafId = null;

  function fmtTime(ms){
    var totalMs = Math.max(0, ms);
    var m = Math.floor(totalMs/60000);
    var s = Math.floor((totalMs%60000)/1000);
    var t = Math.floor((totalMs%1000)/100);
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+t;
  }

  function getBest(key){
    try{
      var v = localStorage.getItem(key);
      return v ? parseFloat(v) : null;
    }catch(e){ return null; }
  }
  function setBest(key, ms){
    try{ localStorage.setItem(key, String(ms)); }catch(e){}
  }

  function refreshMenuBests(){
    Object.keys(LEVELS).forEach(function(k){
      var best = getBest(LEVELS[k].storeKey);
      var el = document.querySelector('.lc-best[data-best="'+k+'"] .lc-best-val');
      el.textContent = best ? fmtTime(best) : '--:--.-';
    });
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  // Fixed cols x rows grid layout sized to the level: cells are always square
  // (min of the width- and height-derived cell size), and the resulting grid
  // is centered in the field so rows never stretch out with empty gaps.
  function layoutTiles(){
    if(!state) return;
    var rect = field.getBoundingClientRect();
    var n = state.tiles.length;
    if(n === 0 || rect.width === 0) return;
    var cols = state.levelDef.cols, rows = state.levelDef.rows;

    var pad = 10;
    var innerW = rect.width - pad*2, innerH = rect.height - pad*2;
    var cell = Math.min(innerW / cols, innerH / rows);
    var gridW = cell * cols, gridH = cell * rows;
    var offX = pad + (innerW - gridW) / 2;
    var offY = pad + (innerH - gridH) / 2;
    var size = Math.max(30, cell - 10);

    state.tiles.forEach(function(tileObj, i){
      if(tileObj.done) return;
      var idx = state.cellAssign[i];
      var cx = idx % cols, cy = Math.floor(idx / cols);
      var x = offX + cx*cell + cell/2;
      var y = offY + cy*cell + cell/2;
      tileObj.el.style.left = x + 'px';
      tileObj.el.style.top = y + 'px';
      tileObj.el.style.width = size + 'px';
      tileObj.el.style.height = size + 'px';
      tileObj.el.style.fontSize = Math.max(12, size*0.32) + 'px';
    });
  }

  function updateTarget(){
    var levelDef = state.levelDef;
    var idx = state.currentIndex;
    if(idx >= levelDef.list.length) return;
    var el = levelDef.list[idx];
    $('targetSymbol').textContent = el.s;
    $('targetSymbol').style.color = 'var(' + CAT_VAR[el.cat] + ')';
    $('targetName').textContent = el.n;
    $('targetZ').textContent = el.z;
    $('progressFill').style.width = (idx / levelDef.list.length * 100) + '%';
  }

  function startLevel(levelKey){
    var levelDef = LEVELS[levelKey];
    field.innerHTML = '';
    state = {
      levelKey: levelKey,
      levelDef: levelDef,
      currentIndex: 0,
      misses: 0,
      startTime: null,
      tiles: [],
      cellAssign: shuffle(Array.from({length: levelDef.cols*levelDef.rows}, function(_,i){ return i; })).slice(0, levelDef.list.length)
    };

    var order = shuffle(levelDef.list);
    order.forEach(function(el){
      var d = document.createElement('div');
      d.className = 'tile';
      d.textContent = el.s;
      d.style.setProperty('--tile-color', 'var(' + CAT_VAR[el.cat] + ')');
      d.dataset.z = el.z;
      d.addEventListener('pointerdown', function(ev){ onTileTap(el, d, ev); }, {passive:true});
      field.appendChild(d);
      state.tiles.push({ el:d, z:el.z, done:false });
    });

    $('missCount').textContent = '0';
    $('timerDisp').textContent = '00:00.0';
    updateTarget();

    menu.style.display = 'none';
    resultScreen.classList.remove('active');
    playScreen.classList.add('active');

    state.locked = true;
    field.classList.add('pre-start');
    layoutTiles();
    runCountdown();
  }

  function runCountdown(){
    var st = state;
    var overlay = $('countdownOverlay'), numEl = $('countdownNum');
    var steps = ['3','2','1','START'];
    var i = 0;
    overlay.classList.add('active');
    function showNext(){
      if(state !== st) return;
      numEl.textContent = steps[i];
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = '';
      i++;
      if(i < steps.length){
        setTimeout(showNext, 600);
      } else {
        setTimeout(function(){
          overlay.classList.remove('active');
          if(state !== st) return;
          field.classList.remove('pre-start');
          st.locked = false;
          st.startTime = performance.now();
          tick();
        }, 450);
      }
    }
    showNext();
  }

  function tick(){
    if(!state || !state.startTime) return;
    var elapsed = performance.now() - state.startTime;
    $('timerDisp').textContent = fmtTime(elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function onTileTap(el, tileEl, ev){
    if(!state || state.locked || tileEl.classList.contains('correct')) return;
    var expected = state.levelDef.list[state.currentIndex];
    if(el.z === expected.z){
      tileEl.classList.add('correct');
      var rec = state.tiles.find(function(t){ return t.el === tileEl; });
      if(rec) rec.done = true;
      state.currentIndex++;
      if(state.currentIndex >= state.levelDef.list.length){
        finishLevel();
      } else {
        updateTarget();
      }
    } else {
      tileEl.classList.remove('wrong');
      void tileEl.offsetWidth;
      tileEl.classList.add('wrong');
      state.misses++;
      $('missCount').textContent = state.misses;
      if(navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
      setTimeout(function(){ tileEl.classList.remove('wrong'); }, 320);
    }
  }

  function finishLevel(){
    if(rafId) cancelAnimationFrame(rafId);
    var elapsed = performance.now() - state.startTime;
    var key = state.levelDef.storeKey;
    var prevBest = getBest(key);
    var isRecord = !prevBest || elapsed < prevBest;
    if(isRecord) setBest(key, elapsed);

    $('resultLevelName').textContent = state.levelDef.label + 'クリア!';
    $('resultTime').textContent = fmtTime(elapsed);
    $('resultMiss').textContent = state.misses;
    $('resultBest').textContent = fmtTime(isRecord ? elapsed : prevBest);
    $('resultRecordBadge').style.display = isRecord ? 'inline-block' : 'none';

    setTimeout(function(){
      playScreen.classList.remove('active');
      resultScreen.classList.add('active');
    }, 260);
  }

  function backToMenu(){
    if(rafId) cancelAnimationFrame(rafId);
    state = null;
    $('countdownOverlay').classList.remove('active');
    playScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    menu.style.display = 'flex';
    refreshMenuBests();
  }

  document.querySelectorAll('.level-card').forEach(function(card){
    card.addEventListener('click', function(){
      startLevel(card.dataset.level);
    });
  });
  $('quitBtn').addEventListener('click', backToMenu);
  $('backBtn').addEventListener('click', backToMenu);
  $('retryBtn').addEventListener('click', function(){
    var lvl = state ? state.levelKey : (resultScreen.dataset.lastLevel || 'basic');
    startLevel(lvl);
  });

  window.addEventListener('resize', function(){
    if(state) layoutTiles();
  });

  refreshMenuBests();
})();
</script>
