<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>脂肪族クエスト 〜反応系統図を完成させよう〜</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('swTheme')||'default');</script>
<style>
:root{
  --ink:#1e293b;
  --bg:#f6f7f4;
  --board:#fbfbf8;
  --grid:#e8eae3;
  --accent:#f59e0b;
  --accent-deep:#d97706;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --gray:#94a3b8;
  --card:#ffffff;
  --line:#475569;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;
}
header{
  background:#1e3a8a;color:#fff;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  flex:none;display:flex;align-items:center;gap:10px;
}
header .title{font-weight:700;font-size:15px;letter-spacing:.02em}
.questSelect{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-weight:700;font-size:13px;padding:4px 6px;font-family:inherit;margin-bottom:2px}
.questSelect option{color:var(--ink)}
header .sub{font-size:10px;opacity:.75}
.progress-wrap{flex:1;min-width:60px}
.progress-label{font-size:10px;text-align:right;opacity:.9;margin-bottom:2px}
.progress-bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.progress-bar>div{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:3px;transition:width .5s}
#btnReset{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;font-size:11px;padding:4px 8px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
#view-map.active{display:flex;flex-direction:column}
/* ---- map ---- */
#mapWrap{position:relative;flex:1;touch-action:none;background:
  linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;background-color:var(--board);cursor:grab;overflow:hidden}
#mapSvg{width:100%;height:100%;display:block}
.zoombtns{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoombtns button{width:40px;height:40px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;font-size:17px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.zoombtns button.off{opacity:.4}
.modebtns{position:absolute;right:10px;top:8px;display:flex;gap:4px;z-index:5}
.modebtns button{background:rgba(255,255,255,.92);border:1.5px solid #e2e8f0;border-radius:8px;font-size:10.5px;font-weight:700;color:#64748b;padding:5px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modebtns button.active{background:#eff6ff;border-color:var(--blue);color:var(--blue)}
.viewfx-toggles{position:absolute;right:10px;top:8px;z-index:5;display:flex;gap:6px}
.viewfx-toggle{background:rgba(255,255,255,.92);border:1.5px solid #e2e8f0;border-radius:8px;font-size:10.5px;font-weight:700;color:#64748b;padding:6px 9px;box-shadow:0 1px 3px rgba(0,0,0,.06);white-space:nowrap}
.viewfx-toggle.on{background:#eff6ff;border-color:var(--blue);color:var(--blue)}
#mq{padding-top:68px}
#answerFxPopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:70;pointer-events:none}
#fireworksOverlay{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.fw-launch{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8dc;box-shadow:0 0 5px 1px #fff8dc}
@keyframes fw-rise{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(var(--riseY));opacity:0}}
.fw-flash{position:absolute;width:10px;height:10px;border-radius:50%;margin:-5px;background:#fff;filter:blur(1px)}
@keyframes fw-flash{0%{transform:scale(.2);opacity:1}100%{transform:scale(5);opacity:0}}
.fw-spark{position:absolute;width:5px;height:2px;border-radius:2px;transform-origin:left center}
@keyframes fw-spark{
  0%{transform:rotate(var(--ang)) translateX(0) scaleX(1);opacity:1}
  55%{transform:rotate(var(--ang)) translateX(var(--dist)) scaleX(1.4);opacity:1}
  100%{transform:rotate(var(--ang)) translateX(calc(var(--dist)*1.2)) translateY(46px) scaleX(.6);opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .fw-launch,.fw-flash,.fw-spark{animation:none !important;opacity:0}
}
#answerFxPopup.show{display:flex}
.afx-box{text-align:center;animation:afxpop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes afxpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.afx-symbol{font-size:130px;font-weight:900;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.afx-symbol.ok{color:var(--green)}
.afx-symbol.ng{color:var(--red)}
.afx-sub{font-size:26px;margin-top:2px}
.afx-confetti{font-size:30px;margin-top:4px;letter-spacing:6px}
@media (max-width:480px){
  .modebtns{left:10px;right:10px;top:8px;gap:6px}
  .modebtns button{flex:1;padding:9px 4px;font-size:11px;min-height:38px}
}
/* map svg pieces */
.node-card{fill:var(--card);stroke:#cbd5e1;stroke-width:1.5}
.node-start .node-card{fill:#eff6ff;stroke:#93c5fd}
.node-locked .node-card{fill:#f8fafc;stroke:#cbd5e1;stroke-dasharray:5 4}
.node-slot .node-card{fill:#fffbeb;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.node-name{font-size:11.5px;fill:var(--ink);text-anchor:middle;font-weight:600}
.qmark{font-size:30px;font-weight:700;fill:#cbd5e1;text-anchor:middle}
.node-slot .qmark{fill:var(--accent)}
.edge-line{stroke:var(--line);stroke-width:2;fill:none}
.edge-locked .edge-line{stroke:#cbd5e1;stroke-dasharray:6 5}
.edge-slot .edge-line{stroke:var(--accent);stroke-dasharray:6 5;stroke-width:2.4}
.edge-part .edge-line{stroke:var(--accent-deep);stroke-width:2.2}
.edge-co .edge-line{stroke-dasharray:2 4;stroke-width:1.6;opacity:.8}
.edge-label-bg{fill:#fff;stroke:#e2e8f0}
.edge-label{font-size:13px;fill:#334155;text-anchor:middle}
.edge-decor .edge-line{stroke:#a1a1aa;stroke-width:1.6;stroke-dasharray:3 3}
.edge-decor .edge-label-bg{fill:#fafafa;stroke:#e4e4e7}
.edge-decor .edge-label-decor{fill:#71717a;font-style:italic}
.edge-q-circle{fill:#fff;stroke:var(--accent);stroke-width:2}
.edge-q-text{font-size:16px;font-weight:700;fill:var(--accent);text-anchor:middle}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.struct text{fill:var(--ink)}
.struct line,.struct polygon,.struct circle,.struct path{stroke:var(--ink)}
.drophot .node-card{fill:#dbeafe !important;stroke:var(--blue) !important;stroke-width:3 !important}
.drophot .edge-q-circle{fill:#dbeafe;stroke:var(--blue);stroke-width:3}
.drophot .edge-q-text{fill:var(--blue)}
.slot-picked .node-card{fill:#fdf2f8 !important;stroke:#ec4899 !important;stroke-width:3 !important}
.slot-picked .qmark{fill:#ec4899 !important}
.slot-picked .edge-q-circle{fill:#fdf2f8;stroke:#ec4899;stroke-width:3}
.slot-picked .edge-q-text{fill:#ec4899}
/* ---- tray ---- */
#tray{flex:none;background:#fff;border-top:2px solid #e2e8f0}
.ttabs{display:flex;gap:6px;padding:6px 8px 0}
.ttabs button{flex:1;border:none;border-radius:10px 10px 0 0;padding:7px 4px;font-size:12px;font-weight:700;background:#f1f5f9;color:#64748b}
.ttabs button.active{background:#fffbeb;color:var(--accent-deep)}
.tscroll{display:flex;gap:8px;overflow-x:auto;padding:8px;background:#fffdf5;-webkit-overflow-scrolling:touch}
.tscroll::-webkit-scrollbar{height:6px}
.tscroll::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:3px}
.tcard{flex:none;width:104px;height:92px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-x;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:grab}
.tcard:active{cursor:grabbing}
.tcard.done{cursor:default}
.tcard .tname{font-size:8.5px;font-weight:600;text-align:center;line-height:1.25;padding:0 3px;color:var(--ink)}
.tcard .treag{font-size:10.5px;font-weight:700;text-align:center;line-height:1.4;padding:0 5px;color:#3730a3}
.tcard.reag{background:#eef2ff;border-color:#c7d2fe}
.tcard.done{opacity:.35;position:relative}
.tcard.done::after{content:'✓';position:absolute;right:4px;top:1px;color:var(--green);font-weight:900;font-size:14px}
.tcard.selected{border-color:#ec4899;border-width:2.5px;background:#fdf2f8;box-shadow:0 0 0 3px rgba(236,72,153,.25)}
.trayhint{font-size:10px;color:#94a3b8;padding:0 10px 6px;background:#fffdf5}
#ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:scale(1.08);display:none}
/* ---- generic panel views ---- */
.panel{height:100%;overflow-y:auto;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.panel h2{font-size:17px;margin:6px 0 12px}
.card-ui{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}
.bigbtn{display:block;width:100%;padding:14px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:700;margin-top:10px}
.bigbtn.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.bigbtn.amber{background:var(--accent-deep)}
.bigbtn:disabled{background:#cbd5e1;color:#f1f5f9;border:none}
.muted{color:#64748b;font-size:12px;line-height:1.6}
/* ---- bottom nav ---- */
nav{flex:none;display:flex;background:#fff;border-top:1px solid #e2e8f0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 6px;border:none;background:none;font-size:11px;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .ico{font-size:20px;line-height:1}
nav button.active{color:var(--blue);font-weight:700}
.badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:20px;max-height:86vh}
}
.sheet h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.modebadge{font-size:10px;background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe;border-radius:99px;padding:2px 8px;font-weight:700}
.closex{margin-left:auto;border:none;background:#f1f5f9;border-radius:99px;width:30px;height:30px;font-size:14px;color:#64748b;flex:none}
.eqbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;margin:8px 0;line-height:1.6}
/* quiz layout */
.rxn{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px 10px;margin-bottom:12px}
.cblock{display:flex;flex-direction:column;align-items:center;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:6px 8px 4px;min-width:104px}
.cblock .cname{font-size:11px;font-weight:600;margin-top:1px;text-align:center}
.qblock{display:flex;align-items:center;justify-content:center;background:#fffbeb;border:2px dashed var(--accent);border-radius:12px;min-width:104px;min-height:86px;font-size:34px;font-weight:800;color:var(--accent)}
.qblock.small{min-height:44px;font-size:22px;min-width:150px}
.reagent-chip{background:#eef2ff;border:1.5px solid #c7d2fe;color:#3730a3;border-radius:14px;padding:6px 12px;font-size:12.5px;font-weight:600;line-height:1.35;text-align:center;max-width:100%}
.plus{font-size:16px;font-weight:700;color:#64748b}
.arrow-h{font-size:22px;font-weight:800;color:#64748b;line-height:1}
.qprompt{font-size:14px;font-weight:700;margin-bottom:8px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choices.textmode{grid-template-columns:1fr}
.choice{border:2px solid #e2e8f0;border-radius:14px;background:#fff;padding:8px 6px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;color:var(--ink);min-height:52px;justify-content:center;text-align:center;line-height:1.45}
.choice:active{background:#f8fafc}
.choice.correct{border-color:var(--green);background:#f0fdf4}
.choice.wrong{border-color:var(--red);background:#fef2f2}
.choice.dim{opacity:.45}
.explain{margin-top:12px;border-radius:14px;padding:12px;font-size:13px;line-height:1.7;display:none}
.explain.ok{display:block;background:#f0fdf4;border:1.5px solid #86efac}
.explain.ng{display:block;background:#fef2f2;border:1.5px solid #fca5a5}
.explain .rname{font-weight:800;font-size:13.5px;margin-bottom:3px}
.explain .eq{background:#fff;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:12px;font-weight:600;border:1px solid #e2e8f0}
/* challenge */
.chal-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:10px;color:#475569}
.chal-timer{text-align:center;font-size:22px;font-weight:800;color:var(--blue);margin-bottom:8px}
.chal-timer.urgent{color:var(--red)}
.rankbig{font-size:64px;font-weight:900;text-align:center;line-height:1.1}
.rank-S{color:#d97706}.rank-A{color:#dc2626}.rank-B{color:#2563eb}.rank-C{color:#16a34a}.rank-D{color:#64748b}
.score-line{text-align:center;font-size:15px;font-weight:700;margin:6px 0 2px}
.review-item{border-bottom:1px solid #f1f5f9;padding:9px 2px;font-size:12.5px;line-height:1.6}
.review-item.review-tap{cursor:pointer;display:flex;align-items:center;gap:6px}
.review-item.review-tap:active{background:#f8fafc}
.review-item.review-tap::after{content:'↻ もう一度';margin-left:auto;flex:none;font-size:11px;color:var(--blue);font-weight:700;white-space:nowrap}
.review-item .ok{color:var(--green);font-weight:700}
.review-item .ng{color:var(--red);font-weight:700}
.scopebtns{display:flex;gap:8px;margin-top:10px}
.scopebtns button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:12.5px;font-weight:700;color:#475569}
.scopebtns button.sel{border-color:var(--blue);color:var(--blue);background:#eff6ff}
.decklist-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sortmini{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b}
.sortmini.sel{border-color:var(--blue);color:var(--blue);background:#eff6ff}
.decklist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.deckbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink)}
.deckbtn:active{border-color:var(--accent)}
.deckbtn.perfect{background:#f0fdf4;border-color:#86efac}
.deckbtn-score{flex:none;text-align:right;font-size:19px;font-weight:800;color:var(--blue);white-space:nowrap}
.deckbtn.perfect .deckbtn-score{color:var(--green)}
.deckbtn-pct{display:block;font-size:11.5px;font-weight:600;color:#64748b}
.memo-img{display:block;max-width:70%;max-height:150px;margin:0 auto 12px}
.fixed-next{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:592px;margin:0 auto;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.fixed-back{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;padding:8px 14px;border-radius:99px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,41,59,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap;max-width:92vw}
#toast.show{opacity:1}
/* onboarding */
#onboard{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
#onboard.open{display:flex}
#onboard .ob{background:#fff;border-radius:20px;padding:22px 20px;max-width:420px;font-size:13.5px;line-height:1.8}
#onboard h2{font-size:18px;margin-bottom:10px}
.detail-rxns{margin-top:10px}
.detail-rxns div{font-size:12.5px;padding:7px 4px;border-bottom:1px solid #f1f5f9;line-height:1.6}
.themeBtn{flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center}
html[data-theme="navy"]{
  --ink:#e8eefc;
  --bg:#0a1120;
  --board:#0e1830;
  --grid:#16233f;
  --card:#132038;
  --line:#4a6386;
}
html[data-theme="navy"] body{background:var(--bg);color:var(--ink)}
html[data-theme="navy"] header{background:linear-gradient(135deg,#0c1830,#122542);border-bottom:1px solid rgba(120,210,255,.25)}
html[data-theme="navy"] .questSelect{background:rgba(255,255,255,.08);border-color:rgba(120,210,255,.3)}
html[data-theme="navy"] #btnReset{border-color:rgba(255,255,255,.3)}
html[data-theme="navy"] .zoombtns button{background:rgba(19,32,56,.85);border-color:rgba(120,210,255,.3);color:var(--ink)}
html[data-theme="navy"] .modebtns button,html[data-theme="navy"] .viewfx-toggle{background:rgba(19,32,56,.85);border-color:rgba(120,210,255,.25);color:#9db6d6}
html[data-theme="navy"] .modebtns button.active,html[data-theme="navy"] .viewfx-toggle.on{background:rgba(79,216,255,.15);border-color:var(--accent);color:var(--accent)}
html[data-theme="navy"] .edge-label-bg{fill:rgba(19,32,56,.92);stroke:rgba(120,210,255,.3)}
html[data-theme="navy"] .edge-label{fill:#9db6d6}
html[data-theme="navy"] .edge-q-circle{fill:rgba(19,32,56,.92)}
html[data-theme="navy"] .node-start .node-card{fill:rgba(79,216,255,.15);stroke:#4fd8ff}
html[data-theme="navy"] image[href*="assets/compounds/"]{filter:invert(1) hue-rotate(180deg)}
html[data-theme="navy"] .node-locked .node-card{fill:rgba(255,255,255,.03);stroke:#3a577f}
html[data-theme="navy"] .node-slot .node-card{fill:rgba(255,177,69,.12);stroke:#ffb145}
html[data-theme="navy"] .node-slot .qmark{fill:#ffb145}
html[data-theme="navy"] .qmark{fill:#3a577f}
html[data-theme="navy"] .drophot .node-card{fill:rgba(79,216,255,.2)!important;stroke:#4fd8ff!important}
html[data-theme="navy"] .drophot .edge-q-circle{fill:rgba(79,216,255,.2);stroke:#4fd8ff}
html[data-theme="navy"] .slot-picked .node-card{fill:rgba(236,72,153,.18)!important;stroke:#ec4899!important}
html[data-theme="navy"] #tray{background:rgba(19,32,56,.92);border-top:1px solid rgba(120,210,255,.2)}
html[data-theme="navy"] .ttabs button{background:rgba(255,255,255,.06);color:#9db6d6}
html[data-theme="navy"] .ttabs button.active{background:rgba(79,216,255,.15);color:var(--accent)}

/* ================= 構造式SVG(鎖状骨格構造) ================= */
const BONDLEN=32, BDX=BONDLEN*Math.cos(Math.PI/6), BDY=BONDLEN*Math.sin(Math.PI/6);
function chainPts(n){
  if(n<=1) return [[0,0]];
  const pts=[[0,0]]; let dir=-1;
  for(let i=1;i<n;i++){ const p=pts[i-1]; pts.push([p[0]+BDX,p[1]+dir*BDY]); dir*=-1; }
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  return pts.map(p=>[p[0]-cx,p[1]-cy]);
}
function bondSVG(a,b,type){
  if(type==='='||type==='#'){
    const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1, ux=-dy/len, uy=dx/len, off=type==='#'?3.4:3.2;
    const mk=o=>`<line x1="${(a[0]+ux*o).toFixed(1)}" y1="${(a[1]+uy*o).toFixed(1)}" x2="${(b[0]+ux*o).toFixed(1)}" y2="${(b[1]+uy*o).toFixed(1)}" stroke-width="1.4"/>`;
    if(type==='=') return mk(off/2)+mk(-off/2);
    return mk(off)+mk(0)+mk(-off);
  }
  return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke-width="1.6"/>`;
}
/* dir: 'r'(右) | 'l'(左) | 'u'(上) | 'd'(下) */
function stubSVG(p,dir,label,dbl){
  const D={r:[1,0],l:[-1,0],u:[0,-1],d:[0,1]}[dir];
  const len=16, ex=p[0]+D[0]*len, ey=p[1]+D[1]*len;
  let s='';
  if(dbl){
    const px=-D[1]*2.6, py=D[0]*2.6;
    s+=`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke-width="1.4"/>`;
    s+=`<line x1="${(p[0]+px).toFixed(1)}" y1="${(p[1]+py).toFixed(1)}" x2="${(ex+px).toFixed(1)}" y2="${(ey+py).toFixed(1)}" stroke-width="1.4"/>`;
  }else{
    s+=`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke-width="1.6"/>`;
  }
  const tx=ex+D[0]*3, ty=ey+(dir==='d'?11:dir==='u'?-4:4);
  const anchor=dir==='r'?'start':dir==='l'?'end':'middle';
  s+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="12.5" stroke="none">${label}</text>`;

}
function ringHex(cx,cy,r){
  const v=[]; for(let i=0;i<6;i++){const a=(-90+i*60)*Math.PI/180; v.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  let s=`<polygon points="${v.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke-width="1.7"/>`;
  for(const i of [1,3,5]){
    const a=v[i], b=v[(i+1)%6], k=0.72;
    const ax=cx+(a[0]-cx)*k, ay=cy+(a[1]-cy)*k, bx=cx+(b[0]-cx)*k, by=cy+(b[1]-cy)*k;
    s+=`<line x1="${(ax+(bx-ax)*0.1).toFixed(1)}" y1="${(ay+(by-ay)*0.1).toFixed(1)}" x2="${(ax+(bx-ax)*0.9).toFixed(1)}" y2="${(ay+(by-ay)*0.9).toFixed(1)}" stroke-width="1.5"/>`;
  }
  return s;
}
/* chain仕様: {c:炭素数, bonds:['-'|'='|'#',...](c-1個), left:左端ラベル, right:右端ラベル,
   leftDbl/rightDbl:左右端が二重結合ラベル(アルデヒド・ケトン・カルボン酸のC=O相当),
   branch:{idx:ラベル}(0始まりの炭素indexに枝を生やす), branchDbl:{idx:true} } */
function chainSVG(spec){
  const n=spec.c, pts=chainPts(n);
  let s='<g class="struct">';
  for(let i=0;i<n-1;i++) s+=bondSVG(pts[i],pts[i+1],(spec.bonds&&spec.bonds[i])||'-');
  if(spec.left) s+=stubSVG(pts[0],'l',spec.left,spec.leftDbl);
  if(spec.right) s+=stubSVG(pts[n-1],'r',spec.right,spec.rightDbl);
  if(spec.branch){
    for(const k in spec.branch){
      const idx=+k, dir=idx%2===0?'d':'u';
      s+=stubSVG(pts[idx],dir,spec.branch[k],spec.branchDbl&&spec.branchDbl[k]);
    }
  }
  return s+'</g>';
}
function structSVG(c){
  if(c.kind==='ring') return `<g class="struct">${ringHex(0,0,24)}</g>`;
  if(c.kind==='text')
    return `<g class="struct"><text x="0" y="7" text-anchor="middle" font-size="22" font-weight="600" font-family="'Times New Roman',Times,serif" stroke="none">${c.text}</text></g>`;
  return chainSVG(c.chain||{c:1});
}

function structFit(id,availW,availH,maxScale){
  if(IMG_MAP[id]){
    const f=(IMG_FILL_OVERRIDE[id]||1)*0.94;
    const w=availW*f, h=availH*f;

    if(!IMG_FILL_OVERRIDE[id]) return img;
    const cw=availW*0.94, ch=availH*0.94;
    const cid='sfclip'+(structFitClipN++);
    return `<clipPath id="${cid}"><rect x="${(-cw/2).toFixed(1)}" y="${(-ch/2).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}"/></clipPath><g clip-path="url(#${cid})">${img}</g>`;
  }
  const b=BBOX[id];
  const cap=COMPOUNDS[id].kind==='text'?(maxScale||1.1)*2.2:(maxScale||1.1);
  const s=Math.min(availW/(b.width+8),availH/(b.height+8),cap);
  const tx=-(b.x+b.width/2)*s, ty=-(b.y+b.height/2)*s;

}

function recomputeAutoReveal(){
  AUTO_REVEAL=new Set();
  if(mapMode==='productGiven'){
    for(const id in COMPOUNDS) if(COMPOUNDS[id].start) AUTO_REVEAL.add(id);
    let changed=true;
    while(changed){
      changed=false;
      for(const r of REACTIONS){
        const froms=r.from.concat(r.coFrom||[]);
        if(froms.every(id=>AUTO_REVEAL.has(id))){
          for(const id of r.to.concat(r.coTo||[])) if(!AUTO_REVEAL.has(id)){AUTO_REVEAL.add(id);changed=true;}
        }

    }
  }
}

function initView(){

function fitView(){

}
function closeFitView(){

function edgePt(n,tx,ty){
  const dx=tx-n.x, dy=ty-n.y, hw=NW/2+8, hh=NH/2+8;
  const k=1/Math.max(Math.abs(dx)/hw,Math.abs(dy)/hh,1e-9);
  return [n.x+dx*Math.min(k,1), n.y+dy*Math.min(k,1)];
}

let SLOT_N=[], SLOT_E=[];
function renderMap(){

    <marker id="ahp" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0.5 L8,4.5 L0,8.5 Z" fill="#d97706"/></marker>
    <marker id="ahl" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0.5 L8,4.5 L0,8.5 Z" fill="#cbd5e1"/></marker>
    <marker id="ahd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0.5 L8,4.5 L0,8.5 Z" fill="#a1a1aa"/></marker>

    const dx0=B.x-A.x, dy0=B.y-A.y, len0=Math.hypot(dx0,dy0)||1;
    let p1,p2,cx,cy,pathD;
    if(r.elbow){
      const clear=r.elbow;
      const midY=Math.min(A.y,B.y)-clear;
      const padY=NH/2+8;
      /* elbowAx/Bx: A/Bの上辺上の任意のx座標(未指定ならA.x/B.xの中央)から
         まっすぐ上へ立ち上げる。斜め線を使わず直角(上→横→下)だけで迂回させる。 */
      const ax=r.elbowAx!=null?r.elbowAx:A.x, bx=r.elbowBx!=null?r.elbowBx:B.x;
      p1=[ax,A.y-padY]; p2=[bx,B.y-padY];
      cx=(ax+bx)/2; cy=midY;
      pathD=`M${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${ax.toFixed(1)},${midY.toFixed(1)} L${bx.toFixed(1)},${midY.toFixed(1)} L${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }else if(r.offset){
      const cids=[r.from[0],r.to[0]].sort();
      const N1=COMPOUNDS[cids[0]], N2=COMPOUNDS[cids[1]];
      const cdx=N2.x-N1.x, cdy=N2.y-N1.y, clen=Math.hypot(cdx,cdy)||1;
      const perpx=-cdy/clen, perpy=cdx/clen, ox=perpx*r.offset, oy=perpy*r.offset;
      const baseP1=edgePt(A,B.x,B.y), baseP2=edgePt(B,A.x,A.y);
      p1=[baseP1[0]+ox,baseP1[1]+oy]; p2=[baseP2[0]+ox,baseP2[1]+oy];
      cx=(p1[0]+p2[0])/2; cy=(p1[1]+p2[1])/2;
      pathD=`M${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }else{
      const curve=r.curve||0;
      const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
      cx=mx-dy0/len0*curve; cy=my+dx0/len0*curve;
      p1=edgePt(A,cx,cy); p2=edgePt(B,cx,cy);
      pathD=`M${p1[0].toFixed(1)},${p1[1].toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    let lx=r.elbow?cx:(p1[0]+2*cx+p2[0])/4, ly=r.elbow?cy:(p1[1]+2*cy+p2[1])/4;
    if(r.reagentLabelT!=null){lx=p1[0]+(p2[0]-p1[0])*r.reagentLabelT; ly=p1[1]+(p2[1]-p1[1])*r.reagentLabelT;}

      g+=`<text class="edge-label" x="${lx.toFixed(1)}" y="${(ly+4.5).toFixed(1)}">${r.short}</text>`;
    }else if(isAv){
      g+=`<circle class="edge-q-hit" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="22" fill="#000" opacity="0"/>`;
      g+=`<g class="pulse"><circle class="edge-q-circle" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="15"/>`;
      g+=`<text class="edge-q-text" x="${lx.toFixed(1)}" y="${(ly+5.5).toFixed(1)}">?</text></g>`;

    (r.coFrom||[]).forEach(c=>co.push([COMPOUNDS[c],B,true,null,r.reagentLabelT!=null?[lx,ly]:null]));
    (r.coTo||[]).forEach(c=>co.push([A,COMPOUNDS[c],true,[cx,cy],null]));
    for(const [S,T,arrow,startPt,endPt] of co){
      const q1=startPt||edgePt(S,T.x,T.y), q2=endPt||edgePt(T,startPt?startPt[0]:S.x,startPt?startPt[1]:S.y);
      g+=`<g class="${cls} edge-co"><path class="edge-line" d="M${q1[0].toFixed(1)},${q1[1].toFixed(1)} L${q2[0].toFixed(1)},${q2[1].toFixed(1)}" ${arrow?`marker-end="${marker}"`:''}/></g>`;
    }
    edges+=g;
  }
  for(const d of DECOR_EDGES){
    const A=COMPOUNDS[d.from], B=COMPOUNDS[d.to];
    if(!onBoard(d.from)||!onBoard(d.to))continue;
    const p1=edgePt(A,B.x,B.y), p2=edgePt(B,A.x,A.y);
    const lx=(p1[0]+p2[0])/2, ly=(p1[1]+p2[1])/2;
    let g=`<g class="edge-decor" data-decor="${d.id}">`;
    g+=`<path class="edge-line" d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${p2[0].toFixed(1)},${p2[1].toFixed(1)}" marker-end="url(#ahd)"/>`;
    const w=textW(d.short)*1.24+14;
    g+=`<rect class="edge-label-bg" x="${(lx-w/2).toFixed(1)}" y="${(ly-11).toFixed(1)}" width="${w.toFixed(1)}" height="22" rx="7"/>`;
    g+=`<text class="edge-label edge-label-decor" x="${lx.toFixed(1)}" y="${(ly+4.5).toFixed(1)}">${d.short}</text>`;
    g+='</g>';
    edges+=g;
  }
  for(const id in COMPOUNDS){
    const c=COMPOUNDS[id], known=onBoard(id);
    let cls='node-locked', isSlot=false;
    if(known) cls=c.start?'node-start':'';
    else if(REACTIONS.some(r=>available(r)&&(r.to.includes(id)||(r.coTo||[]).includes(id)))){
      cls='node-slot'; isSlot=true;
      SLOT_N.push({id,x:c.x,y:c.y,rid:(REACTIONS.find(r=>available(r)&&(r.to.includes(id)||(r.coTo||[]).includes(id)))||{}).id});
    }else if(REACTIONS.some(r=>(r.from.includes(id)||(r.coFrom||[]).includes(id))&&r.to.concat(r.coTo||[]).every(onBoard))){
      cls='node-slot'; isSlot=true;
      SLOT_N.push({id,x:c.x,y:c.y,rid:(REACTIONS.find(r=>(r.from.includes(id)||(r.coFrom||[]).includes(id))&&r.to.concat(r.coTo||[]).every(onBoard))||{}).id});
    }
    let g=`<g class="node ${cls}" data-node="${id}" ${isSlot?`data-dropn="${id}"`:''} transform="translate(${c.x},${c.y})">`;
    g+=`<rect class="node-card" x="${-NW/2}" y="${-NH/2}" width="${NW}" height="${NH}" rx="13"/>`;
    if(known){
      g+=`<g transform="translate(0,-9)">${structFit(id,NW-18,NH-42,0.82)}</g>`;
      const lines=nameLines(c.name,NW-14);
      const fs=lines.length>1?10:(textW(c.name)>NW-14?9.5:11.5);
      const baseY=NH/2-11-(lines.length-1)*6;
      g+=`<text class="node-name" y="${baseY}" font-size="${fs}">${lines.map((ln,i)=>`<tspan x="0" dy="${i===0?0:'1.15em'}">${ln}</tspan>`).join('')}</text>`;
    }else{

  svgEl.innerHTML=defs+edges+nodes;
  let n, total, unit;

/* ---- pan / zoom ---- */
const wrap=document.getElementById('mapWrap');
const ptrs=new Map(); let dragDist=0, pinchD=0;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoombtns')||e.target.closest('.modebtns'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)dragDist=0;
  if(ptrs.size===2){const a=[...ptrs.values()];pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const r=svgEl.getBoundingClientRect();
  if(ptrs.size===1){
    /* パン操作と分かってから初めてポインターをキャプチャする(即キャプチャすると
       クリックの標的がラップ要素にすり替わり、マップ上のクリック選択が効かなくなる) */
    if(Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y)>2){
      try{wrap.setPointerCapture(e.pointerId);}catch(err){}
    }
    const f=vb.w/r.width;
    vb.x-=(e.clientX-prev.x)*f; vb.y-=(e.clientY-prev.y)*f;
    dragDist+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y);
    applyVB();
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...ptrs.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0&&d>0){
      zoomAt((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,pinchD/d);
      dragDist+=Math.abs(d-pinchD);
    }
    pinchD=d; return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});

function zoomAt(cx,cy,f){
  const r=svgEl.getBoundingClientRect();
  const nw=Math.min(Math.max(vb.w*f,240),WORLD.w*1.6);
  f=nw/vb.w;
  const wx=vb.x+(cx-r.left)/r.width*vb.w, wy=vb.y+(cy-r.top)/r.height*vb.h;
  vb.w*=f; vb.h*=f;
  vb.x=wx-(cx-r.left)/r.width*vb.w; vb.y=wy-(cy-r.top)/r.height*vb.h;
  applyVB();
}
function clientToWorld(cx,cy){
  const r=svgEl.getBoundingClientRect();
  return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h];
}

tray.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.active){
    const mouse=e.pointerType==='mouse';

  ghost.style.left=(e.clientX-52)+'px';
  ghost.style.top=(e.clientY-120)+'px';
  updateHot(e.clientX,e.clientY-64);
});
function slotHit(kind,cx,cy){
  const [wx,wy]=clientToWorld(cx,cy);
  if(kind==='compound'){
    for(const s of SLOT_N) if(Math.abs(wx-s.x)<NW/2+22&&Math.abs(wy-s.y)<NH/2+22)return s;
    return null;
  }
  let best=null,bd=1e9;
  for(const s of SLOT_E){const d=Math.hypot(wx-s.x,wy-s.y);if(d<80&&d<bd){bd=d;best=s;}}
  return best;
}
function updateHot(cx,cy){
  const s=drag?slotHit(drag.kind,cx,cy):null;
  let el=null;
  if(s) el=svgEl.querySelector(drag.kind==='compound'?`[data-dropn="${s.id}"]`:`[data-drope="${s.rid}"]`);
  if(hotEl&&hotEl!==el)hotEl.classList.remove('drophot');
  if(el)el.classList.add('drophot');
  hotEl=el; drag.hot=s;
}
function endDrag(e,cancelled){
  if(!drag)return;
  if(hotEl){hotEl.classList.remove('drophot');hotEl=null;}
  ghost.style.display='none';ghost.innerHTML='';
  document.body.style.cursor='';
  const d=drag; drag=null;
  if(cancelled)return;
  if(!d.active){
    if(selectedSlot&&selectedSlot.kind===d.kind){
      const slot=selectedSlot.slot; clearSelectedSlot();
      handleDrop(d.kind,d.key,slot);
      return;
    }
    setSelected(d.kind,d.key,d.card);return;
  }
  const slot=slotHit(d.kind,e.clientX,e.clientY-64);
  if(!slot)return;
  handleDrop(d.kind,d.key,slot);
}
tray.addEventListener('pointerup',e=>endDrag(e,false));

function handleDrop(kind,key,slot){
  const before=new Set(completedIds());
  let ok=false, rid=slot.rid;
  if(kind==='compound'){
    if(key===slot.id){ok=true;state.comp.push(key);}
  }else{
    const r=RXMAP[slot.rid];
    if(key===r.reagent||(r.accept||[]).includes(key)){ok=true;state.reag.push(r.id);}
  }
  if(!ok){
    if(rid){state.weak[rid]=2;updateWeakBadge();}
    save();
    toast('❌ ちがうようだ…(弱点特訓に追加)');
    return;
  }
  save();
  const newly=completedIds().filter(id=>!before.has(id));
  renderMap();
  if(newly.length){
    const allDone=completedIds().length===REACTIONS.length;
    if(state.popupOnComplete===false&&!allDone){
      toast(`🎉 ${RXMAP[newly[0]].name}${newly.length>1?` 他${newly.length}件`:''} 完成!`);
    }else{
      showCompleted(newly);
    }

    toast(kind==='compound'?`⭕ ${COMPOUNDS[key].name} を配置!`:'⭕ 試薬セット!反応の完成まであと少し');
  }
}

/* ================= クイズ生成(チャレンジ・弱点特訓用) ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a.slice()).slice(0,n);}
function buildQuiz(r,mode){
  const q={r,mode,choices:[]};
  if(mode==='product'){
    const valid=new Set([...r.from,...(r.coFrom||[])]);
    for(const r2 of REACTIONS) if(r2.from[0]===r.from[0]&&r2.reagent===r.reagent){r2.to.forEach(c=>valid.add(c));(r2.coTo||[]).forEach(c=>valid.add(c));}
    const pool=Object.keys(COMPOUNDS).filter(c=>!valid.has(c)&&c!==r.to[0]);
    q.choices=sample(pool,3).map(c=>({type:'compound',id:c,ok:false}));
    q.choices.push({type:'compound',id:r.to[0],ok:true});
  }else if(mode==='reactant'){
    const valid=new Set([...r.to,...(r.coTo||[])]);
    for(const r2 of REACTIONS) if(r2.to[0]===r.to[0]&&r2.reagent===r.reagent)valid.add(r2.from[0]);
    const pool=Object.keys(COMPOUNDS).filter(c=>!valid.has(c)&&c!==r.from[0]);
    q.choices=sample(pool,3).map(c=>({type:'compound',id:c,ok:false}));
    q.choices.push({type:'compound',id:r.from[0],ok:true});
  }else{
    const valid=new Set();
    for(const r2 of REACTIONS) if(r2.from[0]===r.from[0]&&r2.to[0]===r.to[0])valid.add(r2.reagent);
    const pool=REAGENTS.filter(t=>!valid.has(t)&&t!==r.reagent);
    q.choices=sample(pool,3).map(t=>({type:'text',text:t,ok:false}));
    q.choices.push({type:'text',text:r.reagent,ok:true});
  }
  shuffle(q.choices);
  return q;
}
function eqText(r){
  const co1=(r.coFrom||[]).map(c=>' + '+COMPOUNDS[c].name).join('');
  const co2=(r.coTo||[]).map(c=>' + '+COMPOUNDS[c].name).join('');
  return `${COMPOUNDS[r.from[0]].name}${co1} ＋ 〔${r.reagent}〕 → ${COMPOUNDS[r.to[0]].name}${co2}`;
}
const MODELABEL={product:'生成物は?',reactant:'反応物(原料)は?',reagent:'試薬・条件は?'};
function quizBodyParts(q){
  const r=q.r;
  let top='';
  if(q.mode==='reactant'){
    top+=`<div class="qblock">?</div>`;
  }else{
    top+=compoundHTML(r.from[0]);
  }
  (r.coFrom||[]).forEach(c=>{top+=`<span class="plus">+</span>${compoundHTML(c)}`;});
  top+=`<span class="plus">+</span>`;
  top+=q.mode==='reagent'?`<div class="qblock small">?</div>`:`<span class="reagent-chip">${r.reagent.replace('(','<br>(')}</span>`;
  top+=`<span class="arrow-h">→</span>`;
  top+=q.mode==='product'?`<div class="qblock">?</div>`:compoundHTML(r.to[0]);
  (r.coTo||[]).forEach(c=>{top+=`<span class="plus">+</span>${compoundHTML(c)}`;});
  const isText=q.choices[0].type==='text';
  let ch=`<div class="choices ${isText?'textmode':''}">`;
  q.choices.forEach((c,i)=>{
    ch+=`<button class="choice" data-i="${i}">${c.type==='compound'?compoundHTML(c.id):c.text}</button>`;
  });
  ch+='</div>';
  return {top,ch};
}
function renderQuiz(el,q,onDone,progressText){
  const r=q.r;
  const {top,ch}=quizBodyParts(q);
  el.innerHTML=`
    ${progressText?`<div class="chal-head">${progressText}</div>`:''}
    <div class="qprompt"><span class="modebadge">${MODELABEL[q.mode]}</span></div>
    <div class="rxn">${top}</div>
    ${ch}
    <div class="explain" id="explainBox"></div>
    <button class="bigbtn" id="nextBtn" style="display:none">次へ</button>`;
  let answered=false;
  el.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return; answered=true;
      const c=q.choices[+btn.dataset.i];
      el.querySelectorAll('.choice').forEach((b,j)=>{
        const cc=q.choices[j];
        if(cc.ok)b.classList.add('correct');
        else if(b===btn)b.classList.add('wrong');
        else b.classList.add('dim');
      });
      const ex=el.querySelector('#explainBox');
      ex.className='explain '+(c.ok?'ok':'ng');
      ex.innerHTML=`<div class="rname">${c.ok?'⭕ 正解! ':'❌ 不正解… '}【${r.name}】</div>
        <div class="eq">${eqText(r)}</div>${r.note}`;
      const nb=el.querySelector('#nextBtn');
      nb.style.display='block';
      nb.onclick=()=>onDone(c.ok);
      nb.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });
}
/* チャレンジモード専用: 解説なし・自動遷移・(任意で)制限時間付き */
function renderChalQuiz(el,q,progressText,timeLimitSec,onDone){
  const {top,ch}=quizBodyParts(q);
  el.innerHTML=`
    ${progressText?`<div class="chal-head">${progressText}</div>`:''}
    ${timeLimitSec?`<div class="chal-timer" id="chalTimer">⏱ ${timeLimitSec}秒</div>`:''}
    <div class="qprompt"><span class="modebadge">${MODELABEL[q.mode]}</span></div>
    <div class="rxn">${top}</div>
    ${ch}`;
  let answered=false;
  function finish(ok,timedOut){
    if(answered)return; answered=true;
    stopChalTimer();
    el.querySelectorAll('.choice').forEach(b=>{
      const cc=q.choices[+b.dataset.i];
      if(cc.ok)b.classList.add('correct');
      else if(!timedOut&&b.dataset.clicked)b.classList.add('wrong');
    });
    setTimeout(()=>onDone(ok,timedOut),650);
  }
  if(timeLimitSec){
    const t0=Date.now();
    const timerEl=el.querySelector('#chalTimer');
    chalTimerIv=setInterval(()=>{
      const left=timeLimitSec-(Date.now()-t0)/1000;
      if(left<=0){finish(false,true);}
      else{timerEl.textContent=`⏱ ${Math.ceil(left)}秒`;timerEl.classList.toggle('urgent',left<=3);}
    },100);
  }
  el.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return;
      btn.dataset.clicked='1';
      finish(q.choices[+btn.dataset.i].ok,false);
    });
  });
}

const CHAL_TIME_LIMIT=60;
function chalRank(kind,correct){
  if(kind==='time')return correct>=15?'S':correct>=11?'A':correct>=7?'B':correct>=3?'C':'D';

function buildChalQueue(){
  const list=[];
  for(let rep=0;rep<3;rep++){
    shuffle(REACTIONS.slice()).forEach(r=>list.push(buildQuiz(r,sample(['product','reactant','reagent'],1)[0])));
  }
  return list;
}
function startChallenge(){
  chal={kind:chalKind,queue:buildChalQueue(),idx:0,correct:0,t0:Date.now(),over:false};
  nextChalQ();
}
function nextChalQ(){
  if(chal.kind==='time'){
    const left=CHAL_TIME_LIMIT-(Date.now()-chal.t0)/1000;
    if(left<=0)return chalResult(true);
  }
  if(chal.idx>=chal.queue.length)return chalResult(true);
  const q=chal.queue[chal.idx];
  const session=chal;
  const timeLimitSec=chal.kind==='score'?10:Math.max(1,Math.ceil(CHAL_TIME_LIMIT-(Date.now()-chal.t0)/1000));
  const progressText=chal.kind==='score'?`連続正解 ${chal.correct}問`:`正解 ${chal.correct}問`;
  chalHeaderUpdate(progressText);
  chalPanel.innerHTML='<div id="cq"></div>';
  renderChalQuiz(document.getElementById('cq'),q,progressText,timeLimitSec,(ok,timedOut)=>{
    if(chal!==session||chal.over)return;
    if(chal.kind==='time'&&timedOut){chalResult(true);return;}
    if(ok){
      chal.correct++; chal.idx++; nextChalQ();
    }else{
      state.weak[q.r.id]=2; save(); updateWeakBadge();
      chalResult(false);
    }
  });
  chalPanel.scrollTop=0;
}
function chalResult(reachedEnd){
  if(!chal||chal.over)return;
  chal.over=true;
  stopChalTimer();
  const correct=chal.correct;
  const sec=Math.floor((Date.now()-chal.t0)/1000);
  const rank=chalRank(chal.kind,correct);
  if(!state.bestList)state.bestList={score:[],time:[]};
  const list=state.bestList[chal.kind]||[];
  list.push({correct,sec,rank});
  list.sort((a,b)=>(b.correct-a.correct)||(a.sec-b.sec));
  state.bestList[chal.kind]=list.slice(0,3);
  save();
  const lbSubmit=LB.currentUser()?LB.submitScore(chal.kind,correct,sec,rank):Promise.resolve();
  chalHeaderUpdate('結果発表');
  const headline=reachedEnd?(chal.kind==='time'?'⏰ タイムアップ!':'🎉 コンプリート!'):'💥 ゲームオーバー';
  chalPanel.innerHTML=`

      <div class="score-line" style="font-size:17px">${headline}</div>

      <div class="score-line">正解 ${correct}問　⏱ ${sec}秒</div>
      <div class="muted">${rank==='S'?'完璧!脂肪族マスター!':rank==='A'?'あと一歩で完全制覇!':rank==='B'?'かなり定着してきた!':rank==='C'?'解説を読んで弱点特訓へ!':'マップモードで基礎から固めよう!'}</div>

      <button class="bigbtn secondary" id="chalHome">トップへ</button>
    </div>
    <div class="card-ui" id="lbBox"></div>`;
  document.getElementById('chalAgain').onclick=startChallenge;
  document.getElementById('chalHome').onclick=renderChallengeHome;
  refreshLbBox(chal.kind);
  lbSubmit.then(()=>refreshLbBox(chal.kind));
  chalPanel.scrollTop=0;
}

const weakPanel=document.getElementById('weakPanel');

let drill=null;
function isMemoKey(key){return key.startsWith('memo:');}
function memoItemFromKey(key){
  const [,deckId,idxStr]=key.split(':');

  return deck?{deck,item:deck.items[+idxStr]}:null;

function weakHeaderUpdate(sub){

function renderWeakHome(){
  weakHeaderUpdate();

  let list='';
  for(const key in state.weak){
    if(isMemoKey(key)){
      const found=memoItemFromKey(key);
      if(!found||!found.item){delete state.weak[key];continue;}
      list+=`<div class="review-item">🧠 ${found.item.q} → ${found.item.a} <span class="muted">(あと${state.weak[key]}回連続正解でクリア)</span></div>`;
    }else{
      const r=RXMAP[key];
      if(!r){delete state.weak[key];continue;}
      list+=`<div class="review-item">🎯 【${r.name}】 ${eqText(r)} <span class="muted">(あと${state.weak[key]}回連続正解でクリア)</span></div>`;
    }
  }
  weakPanel.innerHTML=`

    <div class="card-ui">
      <div style="font-size:13.5px;line-height:1.8">間違えた反応・暗記問題がここに溜まります。<b>2回連続で正解</b>するとリストから消えます。</div>
      <button class="bigbtn amber" id="drillStart" ${n?'':'disabled'}>${n?`特訓スタート(${n}件)`:'弱点はありません🎉'}</button>
    </div>
    ${list?`<div class="card-ui"><b>弱点リスト</b>${list}</div>`:''}`;
  const ds=document.getElementById('drillStart');
  if(n)ds.onclick=startDrill;
}
function startDrill(){
  drill={ids:shuffle(Object.keys(state.weak)),i:0};
  nextDrillQ();
}
function nextDrillQ(){
  while(drill.i<drill.ids.length&&!(drill.ids[drill.i] in state.weak))drill.i++;
  if(drill.i>=drill.ids.length){drill=null;renderWeakHome();updateWeakBadge();toast('特訓おつかれさま!');return;}
  const key=drill.ids[drill.i];
  weakHeaderUpdate(`残り ${drill.ids.length-drill.i} 件`);
  weakPanel.innerHTML='<div id="dq"></div>';
  const finish=ok=>{
    if(ok){
      state.weak[key]--;
      if(state.weak[key]<=0)delete state.weak[key];
    }else state.weak[key]=2;
    save(); updateWeakBadge();
    drill.i++; nextDrillQ();
  };
  const progressText=`残り ${drill.ids.length-drill.i} 件`;
  if(isMemoKey(key)){
    const found=memoItemFromKey(key);
    renderMemoQ(document.getElementById('dq'),found.item,finish,progressText);
  }else{
    const q=buildQuiz(RXMAP[key],sample(['product','reactant','reagent'],1)[0]);
    renderQuiz(document.getElementById('dq'),q,finish,progressText);
  }
  weakPanel.scrollTop=0;
}

      av=sa?(sa.best||0):0; bv=sb?(sb.best||0):0;

    return memoSort.dir==='asc'?av-bv:bv-av;
  });

function startMemoQuiz(deckId,mode){
  if(!state.memoInProgress)state.memoInProgress={};
  const ip=state.memoInProgress[deckId];
  if(ip&&!mode){
    memoHeaderUpdate('再開しますか？');
    setMemoFxVisible(false);
    const deck=MEMO_DECKS.find(d=>d.id===deckId);
    memoPanel.innerHTML=`<div class="card-ui" style="text-align:center">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">「${deck.name}」は ${ip.i} / ${ip.order.length} 問まで進んでいます</div>

      <button class="bigbtn secondary" id="restartBtn">最初から</button>
      <button class="backbtn" id="chooseBack" style="margin-top:8px">← セット選択に戻る</button>
    </div>`;
    document.getElementById('resumeBtn').onclick=()=>startMemoQuiz(deckId,'resume');
    document.getElementById('restartBtn').onclick=()=>startMemoQuiz(deckId,'restart');
    document.getElementById('chooseBack').onclick=()=>renderMemoHome();
    return;
  }
  memoClearAdvanceTimer();
  const deck=MEMO_DECKS.find(d=>d.id===deckId);
  if(mode==='resume'){
    memoQuiz={deck,order:ip.order,i:ip.i,results:ip.results};
  }else{
    delete state.memoInProgress[deckId]; save();
    const order=shuffle(deck.items.map((_,i)=>i));
    memoQuiz={deck,order,i:0,results:[]};
  }

  nextMemoQ();
}
function nextMemoQ(){
  if(memoQuiz.i>=memoQuiz.order.length)return memoQuizResult();
  const deck=memoQuiz.deck;
  const idx=memoQuiz.order[memoQuiz.i];
  const item=deck.items[idx];
  const key=`memo:${deck.id}:${idx}`;
  memoHeaderUpdate(`${deck.name}　${memoQuiz.i+1} / ${memoQuiz.order.length}`);
  setMemoFxVisible(true);
  memoPanel.innerHTML='<div id="mq"></div><button class="fixed-back" id="memoBackBtn">↩ セット選択</button>';
  document.getElementById('memoBackBtn').onclick=()=>{
    memoClearAdvanceTimer();
    state.memoInProgress[memoQuiz.deck.id]={order:memoQuiz.order,i:memoQuiz.i,results:memoQuiz.results};
    save();
    memoQuiz=null; renderMemoHome();
  };
  renderMemoQ(document.getElementById('mq'),item,ok=>{
    memoAdvanceTimer=null;
    memoQuiz.results.push({item,ok});

    memoQuiz.i++; nextMemoQ();
  });

function memoQuizResult(){
  memoClearAdvanceTimer();
  const correct=memoQuiz.results.filter(x=>x.ok).length;
  const total=memoQuiz.results.length;
  const pct=Math.round(100*correct/total);
  const prev=state.memoScores[memoQuiz.deck.id];
  const prevBest=prev?prev.best||0:0;
  const best=Math.max(prevBest,pct);
  state.memoScores[memoQuiz.deck.id]={correct,total,best};
  if(state.memoInProgress)delete state.memoInProgress[memoQuiz.deck.id];
  memoHeaderUpdate(`${memoQuiz.deck.name}　結果発表`);
  setMemoFxVisible(false);
  LB.recordQuizResults('aliphatic', memoQuiz.results.map(x=>({id:x.item.id, ok:x.ok})));
  if(prevBest<100 && best===100) LB.notifyAdmin('perfect', {game:'脂肪族', setName:memoQuiz.deck.name});
  save();
  let review='';
  memoQuiz.results.forEach((x,i)=>{
    review+=`<div class="review-item${x.ok?'':' review-tap'}" ${x.ok?'':`data-i="${i}"`}><span class="${x.ok?'ok':'ng'}">${x.ok?'⭕':'❌'}</span> ${x.item.q} → ${x.item.a}</div>`;
  });
  memoPanel.innerHTML=`
    <h2>結果発表</h2>
    <div class="card-ui" style="text-align:center">
      <div class="score-line" style="font-size:22px">正解 ${correct} / ${total}(${pct}%)</div>
      <div class="muted">${pct>=best?'自己ベスト更新!':`最高記録 ${best}%`}</div>
      <button class="bigbtn" id="memoAgain">もう一度</button>
      <button class="bigbtn secondary" id="memoHome">セット選択に戻る</button>
    </div>
    <div class="card-ui"><b>復習リスト</b>${review}</div>`;
  memoPanel.querySelectorAll('.review-tap').forEach(el=>{
    el.onclick=()=>reviewRetry(memoQuiz.results[+el.dataset.i].item);
  });
  document.getElementById('memoAgain').onclick=()=>startMemoQuiz(memoQuiz.deck.id);
  document.getElementById('memoHome').onclick=()=>{memoQuiz=null;renderMemoHome();};
  memoPanel.scrollTop=0;
}

/* ================= 完成演出 ================= */
const FW_SHELLS=[
  {core:'#ffd75e',edge:'#ff8a3d'},
  {core:'#ff5e6c',edge:'#c81e3a'},
  {core:'#5ec8ff',edge:'#1e6fc8'},
  {core:'#fff',edge:'#ffd75e'},
  {core:'#c893ff',edge:'#6a2fc8'}
];
function fwBurst(x,y){
  const el=document.getElementById('fireworksOverlay');
  const shell=FW_SHELLS[Math.floor(Math.random()*FW_SHELLS.length)];
  const flash=document.createElement('div');
  flash.className='fw-flash';
  flash.style.left=x+'px'; flash.style.top=y+'px';
  flash.style.animation='fw-flash .35s ease-out forwards';
  el.appendChild(flash);
  setTimeout(()=>flash.remove(),400);
  const n=40;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='fw-spark';
    const ang=(i/n)*360+(Math.random()*6-3);
    const dist=60+Math.random()*70;
    const dur=1.3+Math.random()*0.6;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.background=Math.random()<.75?shell.core:shell.edge;
    s.style.boxShadow=`0 0 4px 1px ${shell.core}`;
    s.style.setProperty('--ang',ang+'deg');
    s.style.setProperty('--dist',dist+'px');
    s.style.animation=`fw-spark ${dur}s cubic-bezier(.12,.65,.25,1) forwards`;
    el.appendChild(s);
    setTimeout(()=>s.remove(),dur*1000+150);
  }
}
function fwLaunchTo(x,y,fromY){
  const el=document.getElementById('fireworksOverlay');
  const l=document.createElement('div');
  l.className='fw-launch';
  l.style.left=x+'px'; l.style.top=fromY+'px';
  l.style.setProperty('--riseY',(y-fromY)+'px');
  const dur=.55+Math.random()*.15;
  l.style.animation=`fw-rise ${dur}s ease-out forwards`;
  el.appendChild(l);
  setTimeout(()=>{ l.remove(); fwBurst(x,y); }, dur*1000);
}
function playFireworks(){
  const el=document.getElementById('fireworksOverlay');
  el.innerHTML='';
  const w=window.innerWidth, h=window.innerHeight;
  const shots=6;
  for(let i=0;i<shots;i++){
    setTimeout(()=>{
      fwLaunchTo(w*(0.15+Math.random()*0.7), h*(0.12+Math.random()*0.4), h);
    },i*450);
  }
}
function showComplete(){
  playFireworks();
  infoSheet.innerHTML=`<h3>🎉 脂肪族マップ完成!!<button class="closex" onclick="infoModal.classList.remove('open')">✕</button></h3>
    <div style="font-size:14px;line-height:1.9;text-align:center;padding:8px 0">
    <div style="font-size:52px">🎆🏆🎇</div>
    全 ${REACTIONS.length} 反応を制覇しました!<br>
    完成した系統図は<b>そのまま復習教材</b>です。<br>
    化合物や矢印をタップして反応条件を確認しよう。<br><br>
    <b>🏆チャレンジモード</b>でランクSを目指せ!</div>`;
  infoModal.classList.add('open');
}

/* ================= ナビ・共通 ================= */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+b.dataset.view).classList.add('active');
    if(b.dataset.view!=='challenge'&&chal&&!chal.over){stopChalTimer();chal=null;}
    if(b.dataset.view==='challenge'){
      if(!chal||chal.over)renderChallengeHome();
      else chalHeaderUpdate(chal.kind==='score'?`連続正解 ${chal.correct}問`:`正解 ${chal.correct}問`);
    }else if(b.dataset.view==='memo'){
      if(!memoQuiz)renderMemoHome();
      else memoHeaderUpdate(`${memoQuiz.deck.name}　${memoQuiz.i+1} / ${memoQuiz.order.length}`);
    }else if(b.dataset.view==='weak'){
      if(!drill)renderWeakHome();
      else weakHeaderUpdate(`残り ${drill.ids.length-drill.i} 件`);
    }else{
      restoreMainHeader();
    }
    if(b.dataset.view==='map'){vb.h=vb.w*aspect();applyVB();}
  });
});
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function refreshPopupToggleBtn(){
  const on=state.popupOnComplete!==false;
  const btn=document.getElementById('btnPopupToggle');
  btn.textContent=on?'🔔':'🔕';
  btn.classList.toggle('off',!on);
  btn.title=`完成通知:${on?'ON':'OFF'}`;
}
document.getElementById('btnPopupToggle').addEventListener('click',()=>{
  state.popupOnComplete=state.popupOnComplete===false;
  save(); refreshPopupToggleBtn();
  toast(state.popupOnComplete===false?'完成時のポップアップをOFFにしました':'完成時のポップアップをONにしました');
});
document.getElementById('btnReset').addEventListener('click',()=>{
  if(confirm('進捗をすべてリセットしますか?')){
    state={comp:[],reag:[],weak:{},seen:true,bestList:state.bestList,popupOnComplete:state.popupOnComplete,answerFx:state.answerFx,answerAuto:state.answerAuto,mode:mapMode,memoScores:state.memoScores,memoInProgress:state.memoInProgress};
    save(); renderMap(); updateWeakBadge(); initView();
    toast('リセットしました');
  }
});
function closeOnboard(){
  document.getElementById('onboard').classList.remove('open');
  state.seen=true; save();
}

document.querySelectorAll('.modebtns button').forEach(b=>{
  b.addEventListener('click',()=>{
    mapMode=b.dataset.mode; state.mode=mapMode; save();
    document.querySelectorAll('.modebtns button').forEach(x=>x.classList.toggle('active',x===b));
    const labels={normal:'通常モード',reagentGiven:'🧪 試薬ありモード:化合物だけ当てよう!',productGiven:'⬡ 生成物ありモード:試薬だけ当てよう!'};
    toast(labels[mapMode]);
    renderMap();
  });
});

document.getElementById('questSelect').addEventListener('change',e=>{location.href=e.target.value;});

/* ================= 起動 ================= */
load();
refreshPopupToggleBtn();
refreshAnswerFxBtn();
refreshAnswerAutoBtn();
mapMode=state.mode||'normal';
document.querySelectorAll('.modebtns button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mapMode));
measureAll();
renderMap();
initView();
updateWeakBadge();
if(!state.seen)document.getElementById('onboard').classList.add('open');
</script>
