<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 | Sense of Wonder Lab</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#1e293b;margin:0;background:#f8fafc;padding:24px 16px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:12.5px;color:#64748b;margin-bottom:20px}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .loginWrap{max-width:900px;margin:0 auto}
  .layout{display:flex;gap:16px;align-items:flex-start;max-width:1400px}
  .leftCol{flex:0 0 60%;min-width:0}
  .rightCol{flex:0 0 40%;min-width:0;position:sticky;top:24px}
  #gsiBox{display:flex;justify-content:center;padding:20px 0}
  #err{color:#dc2626;font-size:13px;text-align:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  th{color:#64748b;font-weight:700;font-size:11.5px}
  .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;background:#2563eb;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .stat-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .stat{background:#f8fafc;border-radius:10px;padding:10px 16px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11.5px;color:#64748b}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .tag-active{background:#dcfce7;color:#15803d}
  .tag-idle{background:#f1f5f9;color:#94a3b8}
  .tw{overflow-x:auto}
  .msgbtn,.msgbtn-custom{border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;width:28px;height:28px;font-size:13px;margin-right:3px;cursor:pointer}
  .msgbtn:hover,.msgbtn-custom:hover{background:#eff6ff}
  .msgbtn-set{display:block;border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;margin-bottom:4px;cursor:pointer;white-space:nowrap}
  .msgbtn-set:hover{background:#fef3c7}
  .tag-risk{background:#fee2e2;color:#b91c1c}
  .tag-new{background:#e0e7ff;color:#4338ca}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{flex:1;min-width:160px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;background:#f8fafc}
  .toolbar input[type=search]:focus{outline:2px solid #93c5fd;background:#fff}
  .btn{border:1px solid #e2e8f0;background:#fff;color:#1e293b;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f1f5f9}
  .btn-primary{background:#2563eb;border-color:#2563eb;color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:#334155}
  th.sortable .arrow{opacity:.35;font-size:10px;margin-left:2px}
  th.sortable.sorted .arrow{opacity:1}
  #tbody tr{cursor:pointer}
  #tbody tr:hover{background:#f8fafc}
  #tbody tr.selected{background:#eff6ff}
  #tbody td button{cursor:pointer}
  .resultCount{font-size:12px;color:#94a3b8;margin:-6px 0 12px}
  .detailCard{min-height:200px}
  .detailEmpty{color:#94a3b8;font-size:13px;text-align:center;padding:40px 10px}
  .detailBox h2{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .detailBox .msub{font-size:12px;color:#64748b;margin-bottom:14px;line-height:1.7}
  .progGroup{margin-bottom:14px}
  .progGroup h3{font-size:12.5px;color:#334155;margin:0 0 6px;font-weight:800}
  .progRow{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
  .progRow .pname{flex:1;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progBar{width:70px;height:6px;background:#f1f5f9;border-radius:4px;overflow:hidden;flex:none}
  .progBar i{display:block;height:100%;background:#22c55e;border-radius:4px}
  .progPct{width:32px;text-align:right;font-weight:700;color:#334155;flex:none}
  .progLike{flex:none;border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .progLike:hover{background:#fef3c7}
  .progLike[disabled]{opacity:.5;cursor:default}
  .detailMsgRow{display:flex;gap:6px;margin-top:16px;border-top:1px solid #f1f5f9;padding-top:14px}
  .detailMsgRow input{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12.5px}
  .detailQuick{display:flex;gap:6px;margin-top:8px}
  .noProg{color:#cbd5e1;font-size:12px}
  .achieveBadge{display:inline-block;background:#fffbeb;color:#92400e;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
  .tabbar{display:flex;gap:6px;margin-bottom:16px}
  .tabbtn{border:1px solid #e2e8f0;background:#fff;color:#64748b;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .tabbtn.active{background:#1e293b;border-color:#1e293b;color:#fff}
  .qGameFilter select{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;background:#f8fafc}
  .qCell{white-space:normal;max-width:340px}
  .qCorrect{white-space:normal;max-width:200px;color:#15803d;font-weight:700}
  .qWrongs{white-space:normal;max-width:280px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<h1>👤 会員管理</h1>
<div class="sub">Sense of Wonder Lab のログインユーザー一覧・利用状況</div>

<div class="card loginWrap" id="loginCard">
  <div id="gsiBox"></div>
  <div id="err"></div>
</div>

<div id="dataCard" style="display:none">
  <div class="tabbar">
    <button class="tabbtn active" id="tabUsers">👤 会員一覧</button>
    <button class="tabbtn" id="tabQuestions">📋 全問題一覧</button>
  </div>

  <div class="layout" id="usersView">
    <div class="leftCol">
      <div class="card" style="margin-bottom:16px">
        <div class="stat-row" id="stats"></div>
        <div class="toolbar">
          <input type="search" id="searchBox" placeholder="🔍 ニックネーム・メールで検索">
          <button class="btn" id="broadcastBtn">📣 一斉メッセージ</button>
          <button class="btn" id="csvBtn">⬇️ CSV出力</button>
        </div>
        <div class="resultCount" id="resultCount"></div>
        <div class="tw"><table id="tbl"><thead><tr>
          <th></th>
          <th class="sortable" data-key="nickname">ニックネーム<span class="arrow">▾</span></th>
          <th class="sortable" data-key="ts">登録日<span class="arrow">▾</span></th>
          <th class="sortable sorted" data-key="lastActive">最終アクセス<span class="arrow">▾</span></th>
          <th class="sortable" data-key="days">プレイ日数<span class="arrow">▾</span></th>
          <th>直近のゲーム</th>
          <th title="100%達成したセット数(クリックで詳細)">🎉達成</th>
        </tr></thead><tbody id="tbody"></tbody></table></div>
      </div>
    </div>
    <div class="rightCol">
      <div class="card detailCard" id="detailCard">
        <div class="detailEmpty">👈 一覧から行をクリックすると<br>ここに詳細が表示されます</div>
      </div>
    </div>
  </div>

  <div class="card" id="questionsView" style="display:none">
    <div class="toolbar">
      <input type="search" id="qSearchBox" placeholder="🔍 問題文・正解で検索">
      <span class="qGameFilter"><select id="qGameSelect">
        <option value="">すべてのゲーム</option>
        <option value="芳香族">芳香族</option>
        <option value="脂肪族">脂肪族</option>
        <option value="無機化学">無機化学</option>
      </select></span>
      <span class="qGameFilter"><select id="qSetSelect">
        <option value="">すべてのセット</option>
      </select></span>
    </div>
    <div class="resultCount" id="qResultCount"></div>
    <div class="resultCount" id="qPersonalHint" style="color:#2563eb"></div>
    <div class="tw"><table id="qTbl"><thead><tr>
      <th class="sortable" data-key="game">ゲーム<span class="arrow">▾</span></th>
      <th class="sortable" data-key="set">セット<span class="arrow">▾</span></th>
      <th class="sortable" data-key="q">問題<span class="arrow">▾</span></th>
      <th class="sortable" data-key="correct">正解<span class="arrow">▾</span></th>
      <th>誤答選択肢</th>
      <th class="sortable" data-key="gpct" title="全プレイヤー合計">全体正答率<span class="arrow">▾</span></th>
      <th class="sortable" data-key="upct" title="会員一覧で選択中のユーザーのみ">個人正答率<span class="arrow">▾</span></th>
    </tr></thead><tbody id="qTbody"></tbody></table></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBVmC7sIj4mRwgLyNmqJN5CQg6y_XMHiC0",
  authDomain: "sense-of-wonder-lab.firebaseapp.com",
  databaseURL: "https://sense-of-wonder-lab-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sense-of-wonder-lab",
  storageBucket: "sense-of-wonder-lab.firebasestorage.app",
  messagingSenderId: "120466477782",
  appId: "1:120466477782:web:f0ec79bf0cbbf8ef186f77"
};
const GOOGLE_CLIENT_ID = '120466477782-k5o5f91ugi2pc17bpcje8o6ojvj699rv.apps.googleusercontent.com';
const GAME_NAMES = {inorganic:'無機化学クエスト', aromatic:'芳香族クエスト', aliphatic:'脂肪族クエスト'};
// leaderboard.js 側で、Firebase が禁止する文字(. # $ [ ] /)を含むキー(無機化学の単元名など)
// を可逆エスケープして保存している。ここは別ファイルなのでロジックを複製して復元する。
const FB_KEY_UNESCAPE = [['%2E','.'],['%23','#'],['%24','$'],['%5B','['],['%5D',']'],['%2F','/'],['%25','%']];
function unescapeFbKey(k){
  let out = String(k);
  FB_KEY_UNESCAPE.forEach(([esc,ch])=>{ out = out.split(esc).join(ch); });
  return out;
}
const DECK_NAMES = {
  aroma: {d0:'No.1 芳香族炭化水素(構造式)', d1:'No.2 酸素を含む芳香族炭化水素(構造式)', d2:'No.3 窒素を含む芳香族炭化水素(構造式)', d3:'No.4 構造式マイナー', d4:'No.5 芳香族炭化水素(基礎)', d5:'No.6 酸素を含む芳香族(基礎)', d6:'No.7 酸素を含む芳香族(基礎その2)', d7:'No.8 窒素を含む芳香族(基礎)', d8:'No.9 反応の逆算', d9:'No.10 検出反応まとめ'},
  aliphatic: {d0:'No.1 構造式(名称当て)', d1:'No.2 アルコール・エーテルの性質', d2:'No.3 アルコールの級数・価数', d3:'No.4 アルコールの酸化', d4:'No.5 アルデヒド・ケトン', d5:'No.6 カルボン酸・エステル', d6:'No.7 エステル化・けん化', d7:'No.8 検出反応まとめ'}
};
function get100Sets(u){
  return getAllProgress(u).filter(p=>p.best===100).map(p=>({game:p.game, name:p.name, gameKey:p.gameKey, deckId:p.deckId}));
}
// s.best が未保存(古い記録や同期のタイミングで欠けたレコード)の場合、
// ゲーム画面側(deckbtn の表示ロジック)と同じく、今回の正答率で代用する。
// これを 0 扱いにすると、達成しているのに管理画面だけ未達成に見えるズレが起きる。
function bestPctOf(s){
  if(!s) return 0;
  if(typeof s.best==='number') return s.best;
  if(s.total) return Math.round(100*s.correct/s.total);
  return 0;
}
function getAllProgress(u){
  const out = [];
  const d = u.data || {};
  const aroma = d.aromaQuest2 && d.aromaQuest2.memoScores;
  if(aroma) Object.entries(aroma).forEach(([id,s])=>{ out.push({game:'芳香族', name: DECK_NAMES.aroma[id]||id, gameKey:'aroma', deckId:id, best: bestPctOf(s)}); });
  const aliph = d.aliphaQuest1 && d.aliphaQuest1.memoScores;
  if(aliph) Object.entries(aliph).forEach(([id,s])=>{ out.push({game:'脂肪族', name: DECK_NAMES.aliphatic[id]||id, gameKey:'aliphatic', deckId:id, best: bestPctOf(s)}); });
  const inorg = d.inorganicQuest1 && d.inorganicQuest1.catStats;
  // catStats のキーはFirebase保存時にエスケープされている(例: "No%2E1 ..." )。
  // 表示名は復元するが、deckId は Firebase 上の実際のキー(エスケープ済み)のまま保つ
  // (likes の書き込み先パスにそのまま使うため。中身が変わるわけではない)。
  if(inorg) Object.entries(inorg).forEach(([rawName,s])=>{ out.push({game:'無機化学', name: unescapeFbKey(rawName), gameKey:'inorganic', deckId:rawName, best: bestPctOf(s)}); });
  return out;
}

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateShort(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate();
}
function fmtDateTime(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function handleCredentialResponse(resp){
  const credential = firebase.auth.GoogleAuthProvider.credential(resp.credential);
  auth.signInWithCredential(credential).catch(err=>{
    document.getElementById('err').textContent = 'ログインに失敗しました: '+err.message;
  });
}

let gisReady = false;
function initGIS(){
  if(gisReady || !window.google || !google.accounts) return;
  gisReady = true;
  google.accounts.id.initialize({client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse});
  google.accounts.id.renderButton(document.getElementById('gsiBox'), {theme:'outline', size:'large', text:'signin_with', shape:'pill', width:260});
}
const gisPoll = setInterval(()=>{ if(window.google && google.accounts){ initGIS(); clearInterval(gisPoll); } }, 200);

let allUsers = {};
let sortKey = 'lastActive', sortDir = -1;
let selectedUid = null;

auth.onAuthStateChanged(fbUser=>{
  if(!fbUser){
    document.getElementById('loginCard').style.display='';
    document.getElementById('dataCard').style.display='none';
    return;
  }
  document.getElementById('err').textContent = '';
  db.ref('users').once('value').then(snap=>{
    document.getElementById('loginCard').style.display='none';
    document.getElementById('dataCard').style.display='';
    allUsers = snap.val()||{};
    render();
  }).catch(err=>{
    document.getElementById('err').textContent = '閲覧権限がありません('+escapeHtml(fbUser.email)+')。管理者アカウントでログインしてください。';
    auth.signOut();
  });
});

function buildRows(){
  return Object.entries(allUsers).map(([uid,u])=>({
    uid, nickname:u.nickname||'-', email:u.email||'-', ts:u.ts||0, lastActive:u.lastActive||0,
    days:u.activityDays?Object.keys(u.activityDays).length:0, lastGame:u.lastGame?(GAME_NAMES[u.lastGame]||u.lastGame):'-',
    avatar:u.avatar||null, sets100:get100Sets(u), progress:getAllProgress(u)
  }));
}

function render(){
  const now = Date.now();
  const q = (document.getElementById('searchBox').value||'').trim().toLowerCase();
  let rows = buildRows();

  const total = rows.length;
  const activeToday = rows.filter(r=>now-r.lastActive < 24*3600*1000).length;
  const active7d = rows.filter(r=>now-r.lastActive < 7*24*3600*1000).length;
  const newThisWeek = rows.filter(r=>now-r.ts < 7*24*3600*1000).length;
  const avgDays = total ? (rows.reduce((s,r)=>s+r.days,0)/total).toFixed(1) : '0';
  const gameSet = {aromatic:new Set(), aliphatic:new Set(), inorganic:new Set()};
  rows.forEach(r=>{ r.progress.forEach(p=>{ if(p.best>0){ const gk = p.gameKey==='aroma'?'aromatic':p.gameKey; if(gameSet[gk]) gameSet[gk].add(r.uid); } }); });

  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${total}</b><span>総登録者数</span></div>
    <div class="stat"><b>${activeToday}</b><span>本日アクセス</span></div>
    <div class="stat"><b>${active7d}</b><span>直近7日アクセス</span></div>
    <div class="stat"><b>${newThisWeek}</b><span>今週の新規登録</span></div>
    <div class="stat"><b>${avgDays}</b><span>平均プレイ日数</span></div>
    <div class="stat"><b>${gameSet.aromatic.size}</b><span>芳香族プレイ者</span></div>
    <div class="stat"><b>${gameSet.aliphatic.size}</b><span>脂肪族プレイ者</span></div>
    <div class="stat"><b>${gameSet.inorganic.size}</b><span>無機化学プレイ者</span></div>
  `;

  if(q){
    rows = rows.filter(r=> r.nickname.toLowerCase().includes(q) || r.email.toLowerCase().includes(q));
  }

  rows.sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(typeof av==='string') return sortDir * av.localeCompare(bv, 'ja');
    return sortDir * ((av||0)-(bv||0));
  });

  document.querySelectorAll('#tbl th.sortable').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key===sortKey);
    th.querySelector('.arrow').textContent = (th.dataset.key===sortKey ? (sortDir===1?'▴':'▾') : '▾');
  });

  document.getElementById('resultCount').textContent = q ? `${rows.length}件 / 全${total}件` : `全${total}件`;

  document.getElementById('tbody').innerHTML = rows.map(r=>{
    const idleDays = (now-r.lastActive)/(24*3600*1000);
    let tag = '<span class="tag tag-active">active</span>';
    if(idleDays >= 30) tag = '<span class="tag tag-risk">要フォロー</span>';
    else if(idleDays >= 7) tag = '<span class="tag tag-idle">idle</span>';
    const newTag = (now-r.ts < 7*24*3600*1000) ? '<span class="tag tag-new">NEW</span>' : '';
    const av = r.avatar ? `<img class="avatar" src="${r.avatar}">` : `<span class="avatar">${escapeHtml(r.nickname[0]||'?')}</span>`;
    return `<tr data-uid="${r.uid}"${r.uid===selectedUid?' class="selected"':''}>
      <td>${av}</td>
      <td>${escapeHtml(r.nickname)} ${tag} ${newTag}</td>
      <td>${fmtDateShort(r.ts)}</td>
      <td>${fmtDateTime(r.lastActive)}</td>
      <td>${r.days}日</td>
      <td>${escapeHtml(r.lastGame)}</td>
      <td>${r.sets100.length?`<span class="achieveBadge">🎉 ${r.sets100.length}</span>`:'<span style="color:#cbd5e1">-</span>'}</td>
    </tr>`;
  }).join('');
  if(selectedUid && allUsers[selectedUid]) renderDetail(selectedUid);
}

function selectUser(uid){
  selectedUid = uid;
  render();
  if(document.getElementById('questionsView').style.display !== 'none' && allQuestions) renderQuestions();
}
function renderDetail(uid){
  const u = allUsers[uid];
  if(!u) return;
  const r = buildRows().find(x=>x.uid===uid);
  const av = r.avatar ? `<img class="avatar" src="${r.avatar}" style="width:32px;height:32px">` : `<span class="avatar" style="width:32px;height:32px;font-size:13px">${escapeHtml(r.nickname[0]||'?')}</span>`;
  const groups = {'芳香族':[], '脂肪族':[], '無機化学':[]};
  r.progress.forEach(p=>{ if(groups[p.game]) groups[p.game].push(p); });
  const likes = u.likes || {};
  const groupHtml = Object.entries(groups).map(([game, list])=>{
    if(!list.length) return `<div class="progGroup"><h3>${game}</h3><div class="noProg">まだプレイ記録がありません</div></div>`;
    return `<div class="progGroup"><h3>${game} (${list.length}セット挑戦済み)</h3>${list.map(p=>{
      const already = !!(likes[p.gameKey] && likes[p.gameKey][p.deckId]);
      const likeBtn = p.best===100 ? `<button class="progLike" data-uid="${r.uid}" data-game="${escapeHtml(p.game)}" data-name="${escapeHtml(p.name)}" data-gamekey="${escapeHtml(p.gameKey)}" data-deckid="${escapeHtml(p.deckId)}" ${already?'disabled':''}>${already?'✓済':'👍'}</button>` : '';
      return `
      <div class="progRow">
        <span class="pname">${escapeHtml(p.name)}</span>
        <span class="progBar"><i style="width:${p.best}%;background:${p.best===100?'#22c55e':p.best>=60?'#3b82f6':'#f59e0b'}"></i></span>
        <span class="progPct">${p.best}%</span>
        ${likeBtn}
      </div>`;
    }).join('')}</div>`;
  }).join('');
  document.getElementById('detailCard').innerHTML = `
    <div class="detailBox">
    <h2>${av} ${escapeHtml(r.nickname)}</h2>
    <div class="msub">${escapeHtml(r.email)}<br>登録 ${fmtDateShort(r.ts)} ・ 最終 ${fmtDateTime(r.lastActive)} ・ ${r.days}日プレイ</div>
    <div class="detailQuick">
      <button class="btn" id="rawDataBtn">🔍 生データ</button>
    </div>
    <pre id="rawDataBox" style="display:none;white-space:pre-wrap;word-break:break-all;font-size:11px;background:#111;color:#9f9;padding:8px;border-radius:6px;max-height:260px;overflow:auto"></pre>
    ${groupHtml}
    <div class="detailMsgRow">
      <input type="text" id="detailMsgInput" placeholder="メッセージを送る...">
      <button class="btn btn-primary" id="detailMsgSend">送信</button>
    </div>
    </div>
  `;
  document.getElementById('rawDataBtn').onclick = ()=>{
    const box = document.getElementById('rawDataBox');
    if(box.style.display==='none'){
      box.textContent = JSON.stringify({data:u.data||{}, qStats:u.qStats||{}, likes:u.likes||{}}, null, 2);
      box.style.display = '';
    } else {
      box.style.display = 'none';
    }
  };
  document.getElementById('detailMsgSend').onclick = ()=>{
    const inp = document.getElementById('detailMsgInput');
    const text = inp.value.trim();
    if(!text) return;
    sendMessage(uid, text).then(()=>{ inp.value=''; inp.placeholder='✓ 送信しました'; }).catch(err=>alert('送信に失敗しました: '+err.message));
  };
}

  if(!targets.length){ alert('送信対象がいません。'); return; }
  const text = prompt(`表示中の${targets.length}人全員にメッセージを送ります。内容を入力してください:`);

      .map(v=>'"'+String(v).replace(/"/g,'""')+'"');
    lines.push(cells.join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'members_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function sendMessage(uid, text, extra){

/* ================= 全問題一覧 ================= */
// 各ゲームのHTML内に埋め込まれた問題データ(const DATA / const MEMO_DECKS)を
// fetchで取得し、その場でパースして一覧表示する。別途JSONファイル化はしていないので
// (ゲーム側の読み込み方法を変えるのはリスクがあるため)、admin側だけで完結させている。
function extractBalanced(text, startIdx, openCh, closeCh){
  let depth = 0, inStr = false, strCh = null, esc = false;
  for(let i=startIdx;i<text.length;i++){
    const c = text[i];
    if(inStr){
      if(esc){ esc=false; continue; }
      if(c==='\\'){ esc=true; continue; }
      if(c===strCh) inStr=false;
      continue;
    }
    if(c==='"'||c==="'"||c==='`'){ inStr=true; strCh=c; continue; }
    if(c===openCh) depth++;
    else if(c===closeCh){ depth--; if(depth===0) return text.slice(startIdx, i+1); }
  }
  return null;
}
function findAndExtract(text, marker, openCh, closeCh){
  const idx = text.indexOf(marker);
  if(idx===-1) return null;
  const openIdx = text.indexOf(openCh, idx);
  if(openIdx===-1) return null;
  return extractBalanced(text, openIdx, openCh, closeCh);
}
let allQuestions = null;
function loadAllQuestions(){
  if(allQuestions) return Promise.resolve(allQuestions);
  const sources = [
    {url:'../aromatic-quest/index.html', game:'芳香族', gameKey:'aromatic', marker:'const MEMO_DECKS=', open:'[', close:']', kind:'decks'},
    {url:'../aliphatic-quest/index.html', game:'脂肪族', gameKey:'aliphatic', marker:'const MEMO_DECKS=', open:'[', close:']', kind:'decks'},
    {url:'../inorganic-quest/index.html', game:'無機化学', gameKey:'inorganic', marker:'const DATA = ', open:'{', close:'}', kind:'flat'}
  ];
  return Promise.all(sources.map(s=>
    fetch(s.url).then(r=>r.text()).then(text=>{
      const extracted = findAndExtract(text, s.marker, s.open, s.close);
      if(!extracted) return [];
      let parsed;
      try{ parsed = JSON.parse(extracted); }catch(e){ console.error('[admin] 問題データのパースに失敗', s.url, e); return []; }
      const out = [];
      if(s.kind==='decks'){
        parsed.forEach(deck=>{
          (deck.items||[]).forEach(it=>{
            out.push({game:s.game, gameKey:s.gameKey, id:it.id, set: deck.name, q: it.q, correct: it.a, wrongs: it.wrongs||[]});
          });
        });
      } else {
        (parsed.items||[]).forEach(it=>{
          out.push({game:s.game, gameKey:s.gameKey, id:it.id, set: unescapeFbKey(it.cat), q: it.q, correct: it.correct, wrongs: it.wrongs||[]});
        });
      }
      return out;
    }).catch(err=>{ console.error('[admin] 問題データの取得に失敗', s.url, err); return []; })
  )).then(lists=>{
    allQuestions = lists.flat();
    return allQuestions;
  });
}
let questionStats = null;
function loadQuestionStats(){
  return db.ref('questionStats').once('value').then(snap=>{
    questionStats = snap.val()||{};
    return questionStats;
  }).catch(err=>{ console.error('[admin] questionStats取得失敗', err); questionStats={}; return questionStats; });
}
function pctOf(stat){
  if(!stat || !stat.total) return null;
  return Math.round(100*(stat.correct||0)/stat.total);
}
function fmtPct(stat){
  const p = pctOf(stat);
  if(p===null) return '<span class="noProg">-</span>';
  return `${p}%<span class="qWrongs">(${stat.correct||0}/${stat.total})</span>`;
}
let qSortKey = null, qSortDir = 1;
function updateSetOptions(){
  const gameFilter = document.getElementById('qGameSelect').value;
  const sel = document.getElementById('qSetSelect');
  const prev = sel.value;
  const sets = [...new Set((allQuestions||[]).filter(x=>!gameFilter || x.game===gameFilter).map(x=>x.set))];
  sel.innerHTML = '<option value="">すべてのセット</option>' + sets.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  sel.value = sets.includes(prev) ? prev : '';
}
function renderQuestions(){
  const q = (document.getElementById('qSearchBox').value||'').trim().toLowerCase();
  const gameFilter = document.getElementById('qGameSelect').value;
  const setFilter = document.getElementById('qSetSelect').value;
  let list = allQuestions||[];
  if(gameFilter) list = list.filter(x=>x.game===gameFilter);
  if(setFilter) list = list.filter(x=>x.set===setFilter);
  if(q) list = list.filter(x=> x.q.toLowerCase().includes(q) || String(x.correct).toLowerCase().includes(q));
  document.getElementById('qResultCount').textContent = `${list.length}問`;
  const selUser = selectedUid ? allUsers[selectedUid] : null;
  document.getElementById('qPersonalHint').textContent = selUser ? `👤 ${selUser.nickname||'選択中のユーザー'} の正答率も表示中` : '';

  list = list.map(x=>{
    const gStat = questionStats && questionStats[x.gameKey] && questionStats[x.gameKey][x.id];
    const uStat = selUser && selUser.qStats && selUser.qStats[x.gameKey] && selUser.qStats[x.gameKey][x.id];
    return Object.assign({}, x, {gpct: pctOf(gStat), upct: pctOf(uStat), gStat, uStat});
  });

  if(qSortKey){
    list.sort((a,b)=>{
      const av=a[qSortKey], bv=b[qSortKey];
      // データなし(-)は正答率キーでは常に末尾に固定(昇順・降順どちらでも)
      const aEmpty = av===null||av===undefined, bEmpty = bv===null||bv===undefined;
      if(aEmpty && bEmpty) return 0;
      if(aEmpty) return 1;
      if(bEmpty) return -1;
      if(typeof av==='string') return qSortDir * av.localeCompare(bv, 'ja');
      return qSortDir * (av-bv);
    });
  }
  document.querySelectorAll('#qTbl th.sortable').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key===qSortKey);
    th.querySelector('.arrow').textContent = (th.dataset.key===qSortKey ? (qSortDir===1?'▴':'▾') : '▾');
  });

  document.getElementById('qTbody').innerHTML = list.map(x=>`
    <tr>
      <td>${escapeHtml(x.game)}</td>
      <td>${escapeHtml(x.set)}</td>
      <td class="qCell">${escapeHtml(x.q)}</td>
      <td class="qCorrect">${escapeHtml(String(x.correct))}</td>
      <td class="qWrongs">${x.wrongs.map(w=>escapeHtml(String(w))).join(' / ')}</td>
      <td>${fmtPct(x.gStat)}</td>
      <td>${selUser ? fmtPct(x.uStat) : '<span class="noProg">-</span>'}</td>
    </tr>`).join('');
}

});

document.getElementById('qSetSelect').addEventListener('change', renderQuestions);
document.querySelectorAll('#qTbl th.sortable').forEach(th=>{
  th.addEventListener('click', ()=>{
    if(qSortKey === th.dataset.key) qSortDir *= -1;
    else { qSortKey = th.dataset.key; qSortDir = 1; }
    renderQuestions();
  });
});
document.getElementById('qSearchBox').addEventListener('input', renderQuestions);
</script>
