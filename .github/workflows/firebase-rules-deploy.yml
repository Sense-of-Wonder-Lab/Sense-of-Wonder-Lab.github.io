# main の firebase/database.rules.json が変わったら Firebase に反映する
# （反映前のルールは backup として Actions の実行結果に残る）
name: Firebase ルールを反映
on:
  push:
    branches: [main]
    paths: [firebase/database.rules.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save google-auth-library@9
      - name: ルールを反映
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node firebase/rules.js push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-backup
          path: firebase/backup.rules.json
          if-no-files-found: ignore
